    if (!res.ok || !out.ok) throw new Error(out.error || out.message || ("Fehler " + res.status));
    await laden();
    document.getElementById("msg").innerHTML = `<div class="banner info"><span>${an ? `Rechnung an ${esc(an)} gesendet, Kopie an DATEV und an euer Postfach.` : "Rechnung freigegeben und an DATEV gesendet, Kopie in euer Postfach. Der Kunde bekommt keine Mail."} Sobald das Geld da ist, ordne ich die Zahlung zu.</span></div>`;
  } catch (e) {
    btn.disabled = false; delete btn.dataset.sicher; btn.textContent = "Freigeben und senden";
    document.getElementById("msg").innerHTML = `<div class="banner"><span>Senden hat nicht geklappt: ${esc(e.message)}. Alternativ über „Teilen“ verschicken.</span></div>`;
  }
}
async function teilen() {
  if (!me()) { document.getElementById("msg").innerHTML = `<div class="banner"><span>Bitte zuerst in der Übersicht bei „Ich bin“ auswählen, wer sendet.</span></div>`; return; }
  const blob = pdf().output("blob"), file = new File([blob], dateiname(), { type: "application/pdf" });
  const betreff = `Ihre Rechnung ${R.nummer} von Saleo Design`;
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: betreff, text: mailText() }); ok = true; } catch (e) { if (e.name === "AbortError") return; }
  }
  if (!ok) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = dateiname(); a.click();
    location.href = `mailto:${encodeURIComponent(R.kunde_email || "")}?${F.datev_rechnungsausgang ? "bcc=" + encodeURIComponent(F.datev_rechnungsausgang) + "&" : ""}subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(mailText() + "\n\n(PDF im Anhang)")}`;
    document.getElementById("msg").innerHTML = `<div class="banner info"><span>Die PDF ist heruntergeladen und die Mail vorbereitet. Bitte die PDF an die Mail hängen und senden.</span><button class="btn small primary" id="markiert">Ist gesendet</button></div>`;
    return;
  }
  await markieren();
}
async function markieren() {
  if (R.status === "entwurf") await sb.rpc("rechnung_gesendet", { p_id: R.id, p_wer: me(), p_an: R.kunde_email || null });
  await laden(); document.getElementById("msg").innerHTML = `<div class="banner info"><span>Rechnung als gesendet vermerkt. Sobald das Geld da ist, ordne ich die Zahlung zu.</span></div>`;
}
let E = null;
function editor() {
  const a = R.kunde_adresse || {};
  E = { kunde_name: R.kunde_name || "", kunde_email: R.kunde_email || "", strasse: a.strasse || "", zusatz: a.zusatz || "", plz: a.plz || "", ort: a.ort || "", land: a.land || "DE",
    positionen: R.positionen.map(p => ({ ...p })), hinweis: R.hinweis || "", besteuerung: R.besteuerung, lieferdatum: (R.lieferdatum || "").slice(0, 10) };
  zeigeEditor();
}
function zeigeEditor() {
  const f = (k, l, t = "text", ph = "") => `<label class="ed-f"><span>${l}</span><input data-ed="${k}" type="${t}" value="${esc(E[k] ?? "")}" placeholder="${ph}"></label>`;
  const summe = E.positionen.reduce((s, p) => s + (Number(p.menge) || 0) * (Number(p.preis) || 0), 0);
  document.getElementById("empf").innerHTML = `<section class="card ed"><h2 style="margin:0 0 10px">Rechnung bearbeiten</h2>
    <div class="ed-grid">${f("kunde_name", "Name / Firma")}${f("kunde_email", "E-Mail", "email")}${f("strasse", "Straße und Hausnummer")}${f("zusatz", "Adresszusatz")}${f("plz", "PLZ")}${f("ort", "Ort")}${f("lieferdatum", "Liefer-/Leistungsdatum", "date")}
      <label class="ed-f"><span>Besteuerung</span><select data-ed="besteuerung"><option value="differenz"${E.besteuerung === "differenz" ? " selected" : ""}>Differenzbesteuerung (§ 25a)</option><option value="regel"${E.besteuerung === "regel" ? " selected" : ""}>Regelbesteuerung 19 % (Preise netto)</option></select></label></div>
    <h3 style="margin:14px 0 6px">Positionen</h3>
    ${E.positionen.map((p, i) => `<div class="ed-pos"><input type="text" data-pos="${i}" data-k="text" value="${esc(p.text)}" placeholder="Beschreibung"><input data-pos="${i}" data-k="menge" type="number" min="0" step="1" value="${p.menge}" title="Menge"><input data-pos="${i}" data-k="preis" type="number" step="0.01" value="${p.preis}" title="Einzelpreis in €"><button class="btn small" data-posweg="${i}" title="Position entfernen">✕</button></div>`).join("")}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn small" id="posneu">+ Position</button><button class="btn small" id="versandneu">+ Versandkosten</button><span class="note" style="margin-left:auto">Summe Positionen: <b id="ed-summe">${eurD(summe)}</b></span></div>
    <label class="ed-f" style="margin-top:12px"><span>Hinweis auf der Rechnung (optional)</span><textarea data-ed="hinweis" rows="2">${esc(E.hinweis)}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="edspeichern">Speichern</button><button class="btn" id="edabbruch">Abbrechen</button></div></section>`;
}
async function speichern() {
  const pos = E.positionen.filter(p => String(p.text).trim()).map(p => ({ ...p, text: String(p.text).trim(), menge: Number(p.menge) || 0, preis: Math.round((Number(p.preis) || 0) * 100) / 100 }));
  if (!pos.length) { document.getElementById("msg").innerHTML = `<div class="banner"><span>Mindestens eine Position mit Beschreibung ist nötig.</span></div>`; return; }
  const adresse = { strasse: E.strasse.trim(), plz: E.plz.trim(), ort: E.ort.trim(), land: E.land || "DE", ...(E.zusatz.trim() ? { zusatz: E.zusatz.trim() } : {}) };
  const { error } = await sb.rpc("rechnung_aendern", { p_id: R.id, p: { kunde_name: E.kunde_name.trim(), kunde_email: E.kunde_email.trim(), kunde_adresse: adresse, positionen: pos, hinweis: E.hinweis.trim(), besteuerung: E.besteuerung, lieferdatum: E.lieferdatum } });
  if (error) { document.getElementById("msg").innerHTML = `<div class="banner"><span>Speichern hat nicht geklappt: ${esc(error.message)}</span></div>`; return; }
  E = null; document.getElementById("msg").innerHTML = ""; await laden();
  document.getElementById("msg").innerHTML = `<div class="banner info"><span>Gespeichert. Bitte unten prüfen, dann „Freigeben und senden“.</span></div>`;
}
document.addEventListener("input", e => {
  if (!E) return; const t = e.target;
  if (t.dataset.ed) E[t.dataset.ed] = t.value;
  if (t.dataset.pos) { E.positionen[t.dataset.pos][t.dataset.k] = t.value; const s = E.positionen.reduce((a, p) => a + (Number(p.menge) || 0) * (Number(p.preis) || 0), 0); document.getElementById("ed-summe").textContent = eurD(s); }
});
document.addEventListener("change", e => { if (E && e.target.dataset.ed) E[e.target.dataset.ed] = e.target.value; });
async function laden() {
  const id = new URLSearchParams(location.search).get("id");
  const [{ data: r, error }, { data: f }] = await Promise.all([sb.from("rechnung").select("*").eq("id", id).single(), sb.from("firma").select("*")]);
  if (error || !r) { document.getElementById("paper").innerHTML = `<p class="err">Rechnung nicht gefunden.</p>`; return; }
  R = r; F = Object.fromEntries((f || []).map(x => [x.schluessel, x.wert])); render();
}
document.addEventListener("click", e => {
  if (e.target.id === "pdf") pdf().save(dateiname());
  if (e.target.id === "send") senden();
  if (e.target.id === "teilen") teilen();
  if (e.target.id === "markiert") markieren();
  if (e.target.id === "bearbeiten") editor();
  if (e.target.id === "edabbruch") { E = null; render(); }
  if (e.target.id === "edspeichern") speichern();
  if (e.target.id === "posneu") { E.positionen.push({ text: "", menge: 1, preis: 0 }); zeigeEditor(); }
  if (e.target.id === "versandneu") { E.positionen.push({ text: "Versandkosten", menge: 1, preis: 0 }); zeigeEditor(); }
  if (e.target.dataset && e.target.dataset.posweg) { E.positionen.splice(Number(e.target.dataset.posweg), 1); zeigeEditor(); }
});
(async () => { if (!(await requireSession())) return; await laden(); })();
</script>
</body>
</html>
