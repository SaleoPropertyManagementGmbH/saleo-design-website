<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<base href="/ops/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saleo Design Ops</title>
<meta name="theme-color" content="#1c2f55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saleo Ops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="ops.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="ops.js"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="logo" style="padding:0"><img src="icon-192.png" alt=""><b>Saleo Design Ops<span>Lager, Produkte, Kalkulation</span></b></div>
    <form id="lf" style="display:grid;gap:12px">
      <label>E-Mail<input type="email" id="l-mail" value="info@saleo-group.de" autocomplete="username" required></label>
      <label>Passwort<input type="password" id="l-pw" autocomplete="current-password" required minlength="8"></label>
      <label id="l-pw2-box" hidden>Passwort wiederholen<input type="password" id="l-pw2" autocomplete="new-password" minlength="8"></label>
      <button class="btn primary" id="l-go" type="submit">Anmelden</button>
      <div id="l-msg"></div>
    </form>
    <button class="btn ghost" id="l-mode" type="button">Erstes Mal hier? Zugang einrichten</button>
    <p class="note">Ein gemeinsamer Zugang für Samuel und Leon. Auf jedem Gerät einmal anmelden, danach bleibt die App angemeldet.</p>
  </div>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="logo"><img src="icon-192.png" alt=""><b>Saleo Design Ops<span>USM Haller</span></b></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span id="whobox"></span>
      <span class="live" id="live">verbinde…</span>
      <button class="btn small" id="logout" style="justify-self:start">Abmelden</button>
    </div>
  </aside>
  <div class="mobile-top"><b id="mtitle">Saleo Design Ops</b><span id="whobox-m"></span></div>
  <main class="main"><div class="page" id="view"></div></main>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet" hidden></div>
</div>

<script>
const ICON = {
  start: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>',
  produkte: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M12 4v16"/>',
  planungen: '<path d="M4 20h16"/><path d="M6 16V8l6-4 6 4v8"/><path d="M10 16v-4h4v4"/>',
  lager: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  vorlagen: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  katalog: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
  regeln: '<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  protokoll: '<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  auftraege: '<path d="M3 7h13v10H3zM16 10h3l2 3v4h-5"/><circle cx="7" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/>',
  moebel: '<rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M12 5v12M3 11h18M6 17v2M18 17v2"/>',
  auswertung: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  mehr: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const VIEWS = [["start", "Übersicht"], ["auftraege", "Aufträge"], ["produkte", "Produkte"], ["moebel", "Fertige Möbel"], ["planungen", "Planungen"], ["lager", "Lager"], ["auswertung", "Auswertung"], ["vorlagen", "Vorlagen"], ["katalog", "Teilekatalog"], ["regeln", "USM-Regeln"], ["protokoll", "Protokoll"]];
const D = { lager: [], typen: [], farben: [], plan: [], vorlagen: [], vpos: [], std: [], regeln: [], bew: [], build: null, ins: [], insStand: null, moebel: [], mteile: [], ausw: [], verk: [], auf: [], zahl: [] };
const UI = { view: "start", f: { q: "", gruppe: "", farbe: "", zustand: "", nur: "voll" }, p: { art: "moebel", farbe: "", q: "", sort: "neu" }, kq: "", fv: null, fvFarbe: "24", fvZustand: "G", fvRows: null, del: null, pf: "", sheet: false };
const STATUS = { entwurf: "Entwurf", angebot: "Angebot", reserviert: "Reserviert", verkauft: "Verkauft", archiv: "Archiv" };
const FARBHEX = { "24": "#efeee9", "29": "#c6c8c5", "35": "#a9abae", "32": "#7f8386", "33": "#3b4146", "30": "#232425", "34": "#24344d", "27": "#1a4f8b", "28": "#2f6a46", "36": "#43472f", "25": "#d99c1c", "26": "#e2561d", "23": "#8b1f2a", "22": "#5b3b2a", "31": "#cdbb98", "CR": "#c9ced4", "SW": "#222", "GL": "#cfe6ee" };
const farbName = c => (D.farben.find(f => f.code === c) || { name: c || "" }).name;
const num = n => (Number(n) || 0).toLocaleString("de-DE");
const kurz = t => String(t || "").replace(/^USM Haller\s+/i, "");
const tageHer = t => { const d = Math.floor((Date.now() - new Date(t)) / 864e5); return d <= 0 ? "heute" : d === 1 ? "gestern" : `vor ${d} Tagen`; };
const preisText = e => e.preis != null ? eur(e.preis).replace(",00", "") + (e.vb ? " VB" : "") : "Preis auf Anfrage";
const bild = (e, i = 0, r = "$_35") => ((e.bilder || [])[i] || "").replace("$_57", r);
const proTag = e => { const v = e.aufrufeVerlauf || []; if (v.length < 2) return null; const [d0, a0] = v[0], [d1, a1] = v[v.length - 1]; const t = (new Date(d1) - new Date(d0)) / 864e5; return t > 0 ? (a1 - a0) / t : null; };
const istNeu = e => e.aktiv && (Date.now() - new Date(e.erstellt)) < 3 * 864e5;

/* ---------- Anmeldung ---------- */
let signup = false;
document.getElementById("l-mode").onclick = () => {
  signup = !signup;
  document.getElementById("l-pw2-box").hidden = !signup;
  document.getElementById("l-go").textContent = signup ? "Zugang einrichten" : "Anmelden";
  document.getElementById("l-mode").textContent = signup ? "Zugang schon eingerichtet? Anmelden" : "Erstes Mal hier? Zugang einrichten";
};
document.getElementById("lf").onsubmit = async e => {
  e.preventDefault();
  const email = document.getElementById("l-mail").value.trim(), password = document.getElementById("l-pw").value, msg = document.getElementById("l-msg");
  msg.innerHTML = "";
  if (signup && password !== document.getElementById("l-pw2").value) { msg.innerHTML = `<p class="err">Die Passwörter sind nicht gleich.</p>`; return; }
  const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.innerHTML = `<p class="err">${esc(error.message === "Invalid login credentials" ? "E-Mail oder Passwort falsch." : error.message === "Email not confirmed" ? "Zugang ist noch nicht freigeschaltet. Kurz Bescheid geben, dann schalte ich ihn frei." : error.message)}</p>`; return; }
  if (!data.session) { msg.innerHTML = `<p class="okmsg">Zugang angelegt. Sobald er freigeschaltet ist, hier anmelden.</p>`; return; }
  start();
};
document.getElementById("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- Daten ---------- */
async function loadAll() {
  const [lager, typen, farben, plan, vorlagen, vpos, std, regeln, bew, ins] = await Promise.all([
    fetchAll("lager_health"), fetchAll("teiltyp"), fetchAll("farbe"),
    fetchAll("planung", "id,name,status,geaendert_am,geaendert_von,erstellt_am,daten->>inserat", q => q.order("geaendert_am", { ascending: false })),
    fetchAll("vorlage"), fetchAll("vorlage_position"), fetchAll("usm_standard"), fetchAll("usm_regel"),
    sb.from("lagerbewegung").select("*").order("zeitpunkt", { ascending: false }).limit(300).then(r => { if (r.error) throw r.error; return r.data; }),
    fetch("data/inserate.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : { inserate: [] }).catch(() => ({ inserate: [] }))
  ]);
  const opt = (t, s = "*", m) => fetchAll(t, s, m).catch(() => []);
  const [moebel, mteile, ausw, verk, auf, zahl] = await Promise.all([opt("moebel", "*", q => q.order("erstellt_am", { ascending: false })), opt("moebel_teil"), opt("auswertung_kategorie"), opt("marge_je_verkauf", "*", q => q.order("datum", { ascending: false })),
    opt("auftrag_uebersicht", "*", q => q.order("erstellt_am", { ascending: false })), opt("zahlung", "*", q => q.eq("status", "neu").order("zeitpunkt", { ascending: false }))]);
  Object.assign(D, { lager, typen, farben, plan, vorlagen, vpos, std, regeln, bew, ins: ins.inserate || [], insStand: ins.stand, moebel, mteile, ausw, verk, auf, zahl });
}
async function loadBuildable() {
  const jobs = [];
  D.vorlagen.forEach(v => ["24", "30"].forEach(c => jobs.push(sb.rpc("fehlteile", { p_vorlage: v.code, p_farbe: c, p_zustand: "G" }).then(({ data }) => {
    const rows = data || [], n = rows.length ? Math.min(...rows.map(r => Math.floor(r.vorhanden / r.noetig))) : 0;
    const eng = rows.slice().sort((a, b) => a.vorhanden / a.noetig - b.vorhanden / b.noetig)[0];
    return { v, c, n, eng };
  }))));
  D.build = await Promise.all(jobs);
}

/* ---------- Bausteine ---------- */
const head = (t, p, actions = "") => `<div class="page-head"><div><h1>${t}</h1>${p ? `<p>${p}</p>` : ""}</div>${actions ? `<div class="right-actions">${actions}</div>` : ""}</div>`;
const stat = (label, value, small = "", cls = "") => `<div class="stat"><span>${label}</span><b class="${cls}">${value}</b>${small ? `<small>${small}</small>` : ""}</div>`;
function produktKarte(e) {
  const m = e.masse && e.masse.b ? `${e.masse.b} × ${e.masse.h} × ${e.masse.t || "?"} cm` : "";
  const fronten = [e.klappen ? `${e.klappen} Klappe${e.klappen > 1 ? "n" : ""}` : "", e.auszuege ? `${e.auszuege} Auszug` : "", e.innenauszuege ? `${e.innenauszuege} Innenauszug` : ""].filter(Boolean).join(", ");
  return `<article class="product${e.aktiv ? "" : " gone"}">
    <a class="img" href="${e.planer ? `planer.html?inserat=${e.id}` : esc(e.url)}" ${e.planer ? "" : 'target="_blank" rel="noopener"'}>
      ${bild(e) ? `<img src="${esc(bild(e, 0, "$_59"))}" alt="${esc(kurz(e.titel))}" loading="lazy">` : ""}
      <div class="badges">${istNeu(e) ? `<span class="badge new">Neu</span>` : ""}${!e.aktiv ? `<span class="badge bad">nicht mehr online</span>` : ""}${e.zustand === "N" ? `<span class="badge ok">neuwertig</span>` : ""}</div>
      <span class="price">${preisText(e)}</span></a>
    <div class="body">
      <h3>${esc(kurz(e.titel))}</h3>
      <div class="meta">${e.farbe ? `<span><i class="dot" style="background:${FARBHEX[e.farbe] || "#ccc"}"></i> ${esc(farbName(e.farbe))}</span>` : ""}${m ? `<span>${m}</span>` : ""}${fronten ? `<span>${fronten}</span>` : ""}</div>
      <div class="meta">${e.aufrufe != null ? `<span>${num(e.aufrufe)} Aufrufe${proTag(e) != null ? ` · ${num(Math.round(proTag(e)))}/Tag` : ""}</span>` : ""}<span>online ${tageHer(e.erstellt)}</span>${e.neupreis ? `<span>Neupreis ${eur(e.neupreis).replace(",00", "")}</span>` : ""}</div>
      <div class="actions">${e.planer ? `<a class="btn primary" href="planer.html?inserat=${e.id}">Kalkulieren</a>` : ""}<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Anzeige</a></div>
    </div></article>`;
}

const MST = { aufgebaut: ["ok", "sofort verfügbar"], reserviert: ["warn", "reserviert"], verkauft: ["", "verkauft"], zerlegt: ["", "zerlegt"] };
const verfuegbareMoebel = () => D.moebel.filter(m => ["aufgebaut", "reserviert"].includes(m.status));
function moebelWert(m) {
  return D.mteile.filter(t => t.moebel_id === m.id).reduce((a, t) => { const r = D.lager.find(l => l.code === t.teil); return a + t.menge * Number(r ? r.durchschnittspreis : 0); }, 0);
}
function moebelKarte(m) {
  const ins = m.inserat && D.ins.find(e => e.id === m.inserat), st = MST[m.status] || ["", m.status];
  const teile = D.mteile.filter(t => t.moebel_id === m.id), n = teile.reduce((a, t) => a + t.menge, 0);
  return `<article class="product">
    <a class="img" href="planer.html?moebel=${m.id}">${ins && bild(ins) ? `<img src="${esc(bild(ins, 0, "$_59"))}" alt="" loading="lazy">` : `<div class="noimg">${svg("moebel")}</div>`}
      <div class="badges"><span class="badge ${st[0]}">${st[1]}</span>${m.zustand === "N" ? `<span class="badge ok">neu</span>` : ""}</div>
      ${ins && ins.preis ? `<span class="price">${preisText(ins)}</span>` : ""}</a>
    <div class="body"><h3>${esc(m.name)}</h3>
      <div class="meta">${m.farbe ? `<span><i class="dot" style="background:${FARBHEX[m.farbe] || "#ccc"}"></i> ${esc(farbName(m.farbe))}</span>` : ""}${m.masse ? `<span>${esc(m.masse)} cm</span>` : ""}${m.lagerort ? `<span>Lagerort ${esc(m.lagerort)}</span>` : ""}</div>
      <div class="meta"><span>${n} Teile verbaut</span><span>Warenwert ${eur(moebelWert(m)).replace(",00", "")}</span><span>seit ${tageHer(m.erstellt_am).replace("vor ", "")}</span></div>
      <details class="teile"><summary>Teileliste</summary>${teile.map(t => { const r = D.lager.find(l => l.code === t.teil); return `<div class="row"><span>${t.menge} × ${esc(r ? r.bezeichnung + (r.mass ? " " + r.mass.replace("x", " × ") : "") : t.teil)}</span><span class="code">${esc(t.teil)}</span></div>`; }).join("")}</details>
      <div class="actions"><a class="btn primary" href="planer.html?moebel=${m.id}">Kalkulieren</a>${ins ? `<a class="btn" href="${esc(ins.url)}" target="_blank" rel="noopener">Anzeige</a>` : ""}</div>
    </div></article>`;
}
function vMoebel() {
  const da = verfuegbareMoebel(), weg = D.moebel.filter(m => !["aufgebaut", "reserviert"].includes(m.status));
  const wert = da.reduce((a, m) => a + moebelWert(m), 0);
  return head("Fertige Möbel", "Komplett gekaufte oder fertig aufgebaute Möbel. Ihre Teile zählen im Lager mit, sind dort aber als verbaut markiert und nicht frei.") +
    `<div class="stats">${stat("Sofort verfügbar", da.filter(m => m.status === "aufgebaut").length)}${stat("Reserviert", da.filter(m => m.status === "reserviert").length)}${stat("Warenwert aufgebaut", eur(wert).replace(",00", ""))}${stat("Verkauft bisher", D.moebel.filter(m => m.status === "verkauft").length)}</div>
    ${da.length ? `<div class="products">${da.map(moebelKarte).join("")}</div>` : `<div class="banner info"><span>Noch kein fertiges Möbel erfasst. Einfach per Plaud an Klaus diktieren, z. B. „Fertigmöbel gekauft: Sideboard 153 breit, 74 hoch, 37 tief, schwarz, 2 Klappen, gebraucht, 900 Euro, Benzin 30, Lagerort R1“. Ich rechne es in Einzelteile um und buche es ein.</span></div>`}
    ${weg.length ? `<section class="card"><div class="card-head"><h2>Verkauft oder zerlegt</h2></div><div class="tablewrap"><table><tbody>${weg.map(m => `<tr><td><b>${esc(m.name)}</b><div class="wo">${esc(m.masse || "")}</div></td><td><span class="badge">${(MST[m.status] || ["", m.status])[1]}</span></td><td class="wo">${when(m.geaendert_am)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
}
function vAuswertung() {
  const a = D.ausw.slice().sort((x, y) => Number(y.rohertrag_je_monat) - Number(x.rohertrag_je_monat));
  const maxM = Math.max(1, ...a.map(r => Number(r.rohertrag_je_monat) || 0));
  const tot = D.verk.reduce((s, v) => ({ u: s.u + Number(v.erloes), r: s.r + Number(v.rohertrag), w: s.w + Number(v.wareneinsatz) }), { u: 0, r: 0, w: 0 });
  const pc = n => n == null ? "–" : Number(n).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %";
  const best = k => a.length ? a.slice().sort((x, y) => Number(y[k]) - Number(x[k]))[0].kategorie : "–";
  const insV = D.ins.filter(e => e.aktiv && e.aufrufe != null).sort((x, y) => y.aufrufe - x.aufrufe);
  const maxV = Math.max(1, ...insV.map(e => e.aufrufe));
  const insBlock = insV.length ? `<section class="card"><div class="card-head"><h2>Aufrufe auf Kleinanzeigen</h2><span class="note">${insV.length} Inserate · Stand ${new Date((insV[0].aufrufeVerlauf || [[D.insStand]]).slice(-1)[0][0]).toLocaleDateString("de-DE")}</span></div>
      <div class="tablewrap"><table><thead><tr><th>Inserat</th><th class="num">Preis</th><th class="num">pro Tag</th><th>Aufrufe gesamt</th></tr></thead><tbody>
      ${insV.map(e => `<tr><td>${e.planer ? `<a href="planer.html?inserat=${e.id}">${esc(kurz(e.titel))}</a>` : esc(kurz(e.titel))}</td><td class="num">${preisText(e)}</td><td class="num">${proTag(e) != null ? num(Math.round(proTag(e))) : "–"}</td><td style="min-width:140px"><div class="track"><div class="fill" style="width:${(e.aufrufe / maxV * 100).toFixed(1)}%"></div></div><span class="wo">${num(e.aufrufe)}</span></td></tr>`).join("")}</tbody></table></div>
      <p class="note">Aufrufe pro Tag erscheinen ab dem zweiten täglichen Abgleich. Merkliste und Chats sieht nur euer angemeldetes Konto, die kommen über den Browser dazu.</p></section>` : "";
  return head("Auswertung", "Was verkauft sich oft, wo verdienen wir am meisten, und was bringt pro Monat unterm Strich am meisten. Füllt sich mit jedem gebuchten Verkauf.") +
    `<div class="stats">${stat("Verkäufe", D.verk.length)}${stat("Umsatz", eur(tot.u).replace(",00", ""))}${stat("Rohertrag", eur(tot.r).replace(",00", ""), tot.u ? "Marge " + pc(100 * tot.r / tot.u) : "")}${stat("ROI auf Wareneinsatz", tot.w ? pc(100 * tot.r / tot.w) : "–")}</div>
    ${a.length ? `<div class="stats">${stat("Verkauft sich am häufigsten", esc(best("verkaeufe_je_monat")))}${stat("Höchster ROI", esc(best("roi_prozent")))}${stat("Bester Mittelweg", esc(a[0].kategorie), "höchster Rohertrag pro Monat", "good")}</div>
    <section class="card"><div class="card-head"><h2>Nach Produktart</h2><span class="note">sortiert nach Rohertrag pro Monat</span></div>
      <div class="tablewrap"><table><thead><tr><th>Produktart</th><th class="num">Verkäufe</th><th class="num">pro Monat</th><th class="num">Ø Rohertrag</th><th class="num">Marge</th><th class="num">ROI</th><th class="num">Ø Standzeit</th><th>Rohertrag pro Monat</th></tr></thead><tbody>
      ${a.map(r => `<tr><td><b>${esc(r.kategorie)}</b></td><td class="num">${r.verkaeufe}</td><td class="num">${num(r.verkaeufe_je_monat)}</td><td class="num">${eur(r.rohertrag_je_verkauf)}</td><td class="num">${pc(r.marge_prozent)}</td><td class="num">${pc(r.roi_prozent)}</td><td class="num">${r.standzeit_tage != null ? r.standzeit_tage + " Tage" : "–"}</td><td style="min-width:140px"><div class="track"><div class="fill" style="width:${(Number(r.rohertrag_je_monat) / maxM * 100).toFixed(1)}%"></div></div><span class="wo">${eur(r.rohertrag_je_monat)}</span></td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">ROI = Rohertrag geteilt durch Wareneinsatz. Rohertrag pro Monat verbindet beides: Was selten verkauft wird, aber viel bringt, und was oft verkauft wird, aber wenig bringt, landen fair nebeneinander. Standzeit gibt es für Fertigmöbel (Einkauf bis Verkauf).</p></section>
    <section class="card"><div class="card-head"><h2>Letzte Verkäufe</h2></div><div class="tablewrap"><table><thead><tr><th>Datum</th><th>Verkauf</th><th>Art</th><th class="num">Erlös</th><th class="num">Wareneinsatz</th><th class="num">Rohertrag</th><th class="num">Marge</th></tr></thead><tbody>
      ${D.verk.slice(0, 50).map(v => `<tr><td class="wo">${new Date(v.datum).toLocaleDateString("de-DE")}</td><td>${esc(v.bezeichnung)}</td><td class="wo">${esc(v.kategorie)}</td><td class="num">${eur(v.erloes)}</td><td class="num">${eur(v.wareneinsatz)}</td><td class="num"><b class="${Number(v.rohertrag) >= 0 ? "good" : "neg"}">${eur(v.rohertrag)}</b></td><td class="num">${pc(v.marge_prozent)}</td></tr>`).join("")}</tbody></table></div></section>`

      </div>
      ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Teil</th><th>Farbe</th><th>Zustand</th><th class="num">Bestand</th><th class="num">frei</th><th class="num">reserviert</th><th class="num">Min.</th><th>Fach</th><th class="num">Ø Preis</th><th class="num">Wert</th></tr></thead><tbody>
      ${rows.slice(0, 400).map(r => `<tr><td>${esc(r.bezeichnung)} ${esc(r.mass ? r.mass.replace("x", " × ") : "")}${r.generation === "A" ? ` <span class="badge">alte Gen.</span>` : ""}${r.nur_neu ? ` <span class="badge warn">nur neu</span>` : ""}${r.verbaut ? ` <span class="badge info" title="Diese Teile stecken in einem aufgebauten Möbel">${r.verbaut} verbaut in: ${esc(r.verbaut_in || "")}</span>` : ""}<div class="code">${esc(r.code)}</div></td><td><i class="dot" style="background:${FARBHEX[r.farbe] || "#ccc"}"></i> ${esc(farbName(r.farbe))}</td><td>${r.zustand === "G" ? "gebraucht" : "neu"}</td>
        <td class="num">${r.bestand}</td><td class="num">${r.unter_minimum && r.mindestbestand ? `<span class="pill warn">${r.verfuegbar}</span>` : r.verfuegbar}</td><td class="num">${r.reserviert || ""}</td><td class="num">${r.mindestbestand ?? ""}</td><td class="code">${esc(r.lagerort || "")}</td><td class="num">${eur(r.durchschnittspreis)}</td><td class="num">${eur(r.wert)}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="empty">Keine Teile für diesen Filter.</p>`}</section>`;
}
function vPlanungen() {
  const list = D.plan.filter(p => !UI.pf || p.status === UI.pf);
  return head("Planungen", "Alle gespeicherten Möbel. Auf jedem Gerät gleich, Änderungen erscheinen sofort.", `<a class="btn primary" href="planer.html">${svg("plus")} Neue Planung</a>`) +
    `<div class="chips"><button class="chip" data-pf="" aria-pressed="${!UI.pf}">Alle <span class="wo">${D.plan.length}</span></button>${Object.entries(STATUS).map(([k, n]) => `<button class="chip" data-pf="${k}" aria-pressed="${UI.pf === k}">${n} <span class="wo">${D.plan.filter(p => p.status === k).length}</span></button>`).join("")}</div>
    <section class="card">${list.length ? `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Status</th><th>Geändert</th><th></th></tr></thead><tbody>
    ${list.map(p => `<tr><td><a href="planer.html?id=${p.id}"><b>${esc(p.name)}</b></a></td><td><select data-pstatus="${p.id}" aria-label="Status">${Object.entries(STATUS).map(([k, n]) => `<option value="${k}"${p.status === k ? " selected" : ""}>${n}</option>`).join("")}</select></td>
      <td class="wo">${when(p.geaendert_am)}${p.geaendert_von ? "<br>" + esc(p.geaendert_von) : ""}</td><td class="num"><button class="btn small danger" data-pdel="${p.id}">${UI.del === p.id ? "Wirklich löschen?" : "Löschen"}</button></td></tr>`).join("")}
    </tbody></table></div>` : `<p class="empty">Noch keine Planung in dieser Auswahl.</p>`}</section>`;
}
function vVorlagen() {
  const pos = c => D.vpos.filter(p => p.vorlage === c);
  const fv = UI.fv && D.vorlagen.find(v => v.code === UI.fv);
  const moebel = D.ins.filter(e => e.aktiv && e.planer);
  return head("Vorlagen", "Unsere Inserate, eigene Standardmöbel und die USM-Standardmöbel mit Neupreis, jeweils mit einem Klick im Planer.") +
    `<section class="card"><div class="card-head"><h2>Aus unseren Inseraten</h2><a href="#produkte">als Karten ansehen</a></div>
      <div class="tablewrap"><table><thead><tr><th>Möbel</th><th>Maße (B × H × T)</th><th>Fronten</th><th class="num">Inseratspreis</th><th></th></tr></thead><tbody>
      ${moebel.map(e => `<tr><td><b>${esc(kurz(e.titel))}</b><div class="wo"><i class="dot" style="background:${FARBHEX[e.farbe] || "#ccc"}"></i> ${esc(farbName(e.farbe))}</div></td><td>${e.masse.b} × ${e.masse.h} × ${e.masse.t || "?"} cm</td><td class="wo">${e.klappen ? e.klappen + " Klappen" : "offen"}${e.auszuege ? ", " + e.auszuege + " Auszüge" : ""}</td><td class="num">${preisText(e)}</td><td class="num"><a class="btn small primary" href="planer.html?inserat=${e.id}">Kalkulieren</a></td></tr>`).join("")}
      </tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Saleo-Standardmöbel: was fehlt?</h2>
      <div class="filters"><select id="fv-farbe" aria-label="Farbe">${D.farben.filter(f => /^\d+$/.test(f.code)).map(f => `<option value="${f.code}"${UI.fvFarbe === f.code ? " selected" : ""}>${esc(f.name)}</option>`).join("")}</select>
      <select id="fv-zustand" aria-label="Zustand"><option value="G"${UI.fvZustand === "G" ? " selected" : ""}>Gebraucht</option><option value="N"${UI.fvZustand === "N" ? " selected" : ""}>Neu</option></select></div></div>
      <div class="tablewrap"><table><tbody>
      ${D.vorlagen.map(v => `<tr><td><b>${esc(v.name)}</b><div class="code">${esc(v.code)}</div></td><td class="num wo">${pos(v.code).reduce((a, p) => a + p.menge, 0)} Teile</td><td class="num"><button class="btn small" data-fv="${esc(v.code)}">Fehlteile prüfen</button></td></tr>`).join("")}</tbody></table></div>
      ${fv && UI.fvRows ? `<h3 style="margin:16px 0 6px;font-size:.95rem">${esc(fv.name)}, ${esc(farbName(UI.fvFarbe))}, ${UI.fvZustand === "G" ? "gebraucht" : "neu"}</h3><div class="tablewrap"><table><thead><tr><th>Teil</th><th class="num">nötig</th><th class="num">vorhanden</th><th class="num">fehlt</th></tr></thead><tbody>
        ${UI.fvRows.map(r => `<tr><td class="code">${esc(r.teil)}</td><td class="num">${r.noetig}</td><td class="num">${r.vorhanden}</td><td class="num">${r.fehlt ? `<span class="pill warn">${r.fehlt}</span>` : `<span class="pill ok">0</span>`}</td></tr>`).join("")}</tbody></table></div>` : ""}</section>
    <section class="card"><div class="card-head"><h2>USM-Standardmöbel mit Neupreis</h2><span class="note">smow, Stand 10.10.2026</span></div>
      <div class="tablewrap"><table><thead><tr><th>Möbel</th><th>Felder</th><th>Fronten</th><th>Neupreis</th><th></th></tr></thead><tbody>
      ${D.std.map(s => `<tr><td><b>${esc(s.name)}</b><div class="wo">${esc(s.aussenmass)} · Tiefe ${esc(s.tiefe)} · <a href="${esc(s.quelle)}" target="_blank" rel="noopener">Quelle</a></div></td><td class="code">${s.felder_breite.join("+")} × ${s.felder_hoehe.join("+")}</td><td class="wo">${esc(s.fronten)}</td><td class="wo">${esc(s.neupreis)}</td><td class="num"><a class="btn small" href="planer.html?std=${encodeURIComponent(s.name)}">Im Planer</a></td></tr>`).join("")}</tbody></table></div></section>`;
}
function vKatalog() {
  const q = UI.kq.toLowerCase();
  const rows = D.typen.filter(t => !q || [t.code, t.bezeichnung, t.hinweis, t.usm_nr, (t.masse || []).join(" ")].join(" ").toLowerCase().includes(q)).sort((a, b) => a.gruppe.localeCompare(b.gruppe) || a.code.localeCompare(b.code));
  const teile = D.ins.filter(e => e.aktiv && e.art === "teil");
  let g = "";
  return head("Teilekatalog", "Alle USM-Teile mit belegten Maßen, Artikelnummern und Quellen.") +
    (teile.length ? `<section class="card"><div class="card-head"><h2>Einzelteile, die wir gerade anbieten</h2><a href="#produkte">alle Produkte</a></div>${teile.map(e => `<div class="list-row">${bild(e) ? `<img src="${esc(bild(e))}" alt="" loading="lazy">` : ""}<div class="grow"><div class="t">${esc(kurz(e.titel))}</div><div class="wo">${preisText(e)}</div></div><a class="btn small" href="${esc(e.url)}" target="_blank" rel="noopener">Anzeige</a></div>`).join("")}</section>` : "") +
    `<section class="card"><div class="filters" style="margin-bottom:12px"><input type="search" id="kq" value="${esc(UI.kq)}" placeholder="z. B. Klappe, 18444, 750x350"><span class="note">${rows.length} Teiltypen</span></div>
    <div class="tablewrap"><table><thead><tr><th>Teil</th><th>Maße</th><th>USM-Nr.</th><th>Hinweis</th><th>Quelle</th></tr></thead><tbody>
    ${rows.map(t => { const h = t.gruppe !== g ? `<tr class="grp"><td colspan="5">${esc(t.gruppe.replace(/^[A-Z] /, ""))}</td></tr>` : ""; g = t.gruppe;
      const links = String(t.quellen || "").split(/[\s,;]+/).filter(u => /^https?:/.test(u));
      return h + `<tr><td><b>${esc(t.bezeichnung)}</b><div class="code">${esc(t.code)}</div></td><td class="code" style="white-space:normal;max-width:240px">${esc((t.masse || []).join(", "))}</td><td class="code">${esc(t.usm_nr || "")}</td><td class="wo" style="max-width:320px">${esc(t.hinweis || "")}</td><td class="src">${esc(t.quelle_status || "")}${links.map((u, i) => ` <a href="${esc(u)}" target="_blank" rel="noopener">${links.length > 1 ? i + 1 : "Link"}</a>`).join("")}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}
function vRegeln() {
  const B = { sicherheit: "Kippsicherheit und Verankerung", statik: "Tragkraft", rollen: "Rollen", konstruktion: "Konstruktion und Größen", masse: "Maße und Gewichte", generation: "Generationen", tisch: "Tische", pflege: "Pflege" };
  const fmt = w => w == null ? "" : Array.isArray(w) ? w.join(", ") : typeof w === "object" ? JSON.stringify(w) : String(w);
  return head("USM-Regeln", "Aus USM-Unterlagen und von smow, Stand 10.10.2026. Der Planer prüft die wichtigsten davon automatisch.") +
    Object.entries(B).map(([k, n]) => { const rs = D.regeln.filter(r => r.bereich === k); if (!rs.length) return "";
      return `<section class="card"><div class="card-head"><h2>${n}</h2></div><div class="tablewrap"><table><tbody>${rs.map(r => `<tr><td style="width:50%"><b style="font-weight:550">${esc(r.regel)}</b>${r.bedingung ? `<div class="wo">${esc(r.bedingung)}</div>` : ""}</td><td style="white-space:normal">${esc(fmt(r.wert))} ${esc(r.einheit || "")}</td><td class="src">${r.status && r.status.startsWith("unbest") ? `<span class="badge warn">unbestätigt</span>` : `<span class="badge ok">belegt</span>`}${r.quelle ? ` <a href="${esc(r.quelle)}" target="_blank" rel="noopener">Quelle</a>` : ""}</td></tr>`).join("")}</tbody></table></div></section>`; }).join("");
}
function vProtokoll() {
  return head("Protokoll", "Jede Inventur, jeder Einkauf und Verkauf mit Bestand und Durchschnittspreis danach.") +
    `<section class="card">${D.bew.length ? `<div class="tablewrap"><table><thead><tr><th>Zeit</th><th>Art</th><th>Teil</th><th class="num">Menge</th><th class="num">Preis/Stk</th><th class="num">Bestand</th><th class="num">Ø danach</th><th>Notiz</th></tr></thead><tbody>
    ${D.bew.map(r => `<tr><td class="wo">${when(r.zeitpunkt)}</td><td>${esc(r.art)}</td><td class="code">${esc(r.teil)}</td><td class="num">${r.menge > 0 ? "+" : ""}${r.menge}</td><td class="num">${r.preis_stueck != null ? eur(r.preis_stueck) : ""}</td><td class="num">${r.bestand_danach}</td><td class="num">${eur(r.durchschnitt_danach)}</td><td class="wo">${esc(r.notiz || "")}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="empty">Noch keine Buchungen.</p>`}</section>`;
}
function navHtml() {
  const neu = D.ins.filter(istNeu).length;
  return VIEWS.map(([k, n]) => `<a href="#${k}"${UI.view === k ? ' aria-current="page"' : ""}>${svg(k)}${n}${k === "produkte" && neu ? `<span class="count">${neu} neu</span>` : k === "planungen" && D.plan.length ? `<span class="count">${D.plan.length}</span>` : k === "auftraege" && offeneAuftraege().length ? `<span class="count hot">${offeneAuftraege().length}</span>` : k === "moebel" && verfuegbareMoebel().length ? `<span class="count">${verfuegbareMoebel().length}</span>` : ""}</a>`).join("");
}
function render() {
  document.getElementById("nav").innerHTML = navHtml();
  const tab = [["start", "Übersicht"], ["auftraege", "Aufträge"], ["neu", "Planen"], ["produkte", "Produkte"], ["mehr", "Mehr"]];
  const inMehr = !["start", "auftraege", "produkte"].includes(UI.view);
  document.getElementById("tabbar").innerHTML = tab.map(([k, n]) => k === "neu" ? `<a href="planer.html">${svg("plus")}${n}</a>` : k === "mehr" ? `<button id="more"${inMehr ? ' aria-current="page"' : ""}>${svg("mehr")}${n}</button>` : `<a href="#${k}"${UI.view === k ? ' aria-current="page"' : ""}>${svg(k)}${n}</a>`).join("");
  document.getElementById("sheet").hidden = !UI.sheet;
  document.getElementById("sheet").innerHTML = UI.sheet ? `<div class="sheet-bg" id="sheet-bg"></div><div class="sheet"><nav class="nav">${navHtml()}</nav><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 6px 0"><span class="live${document.getElementById("live").classList.contains("on") ? " on" : ""}">${document.getElementById("live").textContent}</span><button class="btn small" id="logout2">Abmelden</button></div></div>` : "";
  document.getElementById("whobox").innerHTML = whoPicker();
  document.getElementById("whobox-m").innerHTML = whoPicker().replace('id="who"', 'id="who-m"');
  document.getElementById("mtitle").textContent = (VIEWS.find(v => v[0] === UI.view) || VIEWS[0])[1];
  const fn = { start: vStart, auftraege: vAuftraege, produkte: vProdukte, moebel: vMoebel, auswertung: vAuswertung, lager: vLager, planungen: vPlanungen, vorlagen: vVorlagen, katalog: vKatalog, regeln: vRegeln, protokoll: vProtokoll }[UI.view] || vStart;
  const active = document.activeElement && document.activeElement.id, pos = active && document.activeElement.selectionStart;
  document.getElementById("view").innerHTML = fn();
  if (active && /^(lf-q|kq|pq)$/.test(active) && document.getElementById(active)) { const el = document.getElementById(active); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
}

/* ---------- Ereignisse ---------- */
window.addEventListener("hashchange", () => { UI.view = location.hash.slice(1) || "start"; UI.sheet = false; render(); window.scrollTo(0, 0); });
document.addEventListener("input", e => {
  if (e.target.id === "lf-q") { UI.f.q = e.target.value; render(); }
  if (e.target.id === "kq") { UI.kq = e.target.value; render(); }
  if (e.target.id === "pq") { UI.p.q = e.target.value; render(); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "who-m") { store.set("sdo_wer", t.value); render(); }
  else if (t.id && t.id.startsWith("lf-") && t.id !== "lf-q") { UI.f[t.id.slice(3)] = t.value; render(); }
  else if (t.id === "pfarbe") { UI.p.farbe = t.value; render(); }
  else if (t.id === "psort") { UI.p.sort = t.value; render(); }
  else if (t.id === "fv-farbe" || t.id === "fv-zustand") { UI[t.id === "fv-farbe" ? "fvFarbe" : "fvZustand"] = t.value; if (UI.fv) await checkVorlage(UI.fv); else render(); }
  else if (t.dataset.pstatus) { await sb.from("planung").update({ status: t.value, geaendert_am: new Date().toISOString(), geaendert_von: me() || null }).eq("id", t.dataset.pstatus); }
  else if (t.id === "who") render();
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "more") { UI.sheet = true; render(); }
  else if (b.id === "sheet-bg" || e.target.id === "sheet-bg") { UI.sheet = false; render(); }
  else if (b.id === "logout2") { await sb.auth.signOut(); location.reload(); }
  else if (b.dataset.part) { UI.p.art = b.dataset.part; render(); }
  else if (b.dataset.pf != null) { UI.pf = b.dataset.pf; render(); }
  else if (b.dataset.fv) await checkVorlage(b.dataset.fv);
  else if (b.dataset.afrei) {
    if (!me()) { UI.flash = "Bitte zuerst bei „Ich bin“ auswählen, wer freigibt."; render(); return; }
    b.disabled = true; b.textContent = "wird freigegeben…";
    const { error } = await sb.rpc("auftrag_freigeben", { p_id: b.dataset.afrei, p_wer: me() });
    UI.flash = error ? "Freigabe ging nicht: " + error.message : null; liveReload();
  }
  else if (b.dataset.azurueck) { await sb.rpc("auftrag_zurueck", { p_id: b.dataset.azurueck }); liveReload(); }
  else if (b.dataset.pdel) {
    if (UI.del !== b.dataset.pdel) { UI.del = b.dataset.pdel; render(); setTimeout(() => { if (UI.del === b.dataset.pdel) { UI.del = null; render(); } }, 4000); return; }
    await sb.from("planung").delete().eq("id", b.dataset.pdel); UI.del = null;
  }
});
document.addEventListener("click", e => { if (e.target.id === "sheet-bg") { UI.sheet = false; render(); } });
async function checkVorlage(code) {
  UI.fv = code;
  const { data, error } = await sb.rpc("fehlteile", { p_vorlage: code, p_farbe: UI.fvFarbe, p_zustand: UI.fvZustand });
  UI.fvRows = error ? [] : data; render();
}
let reloadTimer = null;
function liveReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(async () => { await loadAll(); render(); loadBuildable().then(render); }, 400); }

/* ---------- Start ---------- */
async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { document.getElementById("login").hidden = false; document.getElementById("app").hidden = true; return; }
  const next = new URLSearchParams(location.search).get("next");
  if (next && /^planer\.html/.test(next)) { location.replace(next); return; }
  document.getElementById("login").hidden = true; document.getElementById("app").hidden = false;
  UI.view = location.hash.slice(1) || "start";
  document.getElementById("view").innerHTML = `<p class="empty">lade…</p>`;
  try { await loadAll(); } catch (err) { document.getElementById("view").innerHTML = `<p class="err">Daten nicht geladen: ${esc(err.message)}</p>`; return; }
  if (!D.farben.length) { document.getElementById("view").innerHTML = `<p class="err">Dieser Zugang ist nicht freigeschaltet. Nur info@saleo-group.de hat Zugriff.</p>`; return; }
  render();
  loadBuildable().then(render);
  sb.channel("ops").on("postgres_changes", { event: "*", schema: "public", table: "teil" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "planung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "lagerbewegung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "moebel" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "auftrag" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "zahlung" }, liveReload)
    .subscribe(s => { const el = document.getElementById("live"); el.textContent = s === "SUBSCRIBED" ? "live verbunden" : "offline"; el.classList.toggle("on", s === "SUBSCRIBED"); });
}
start();
</script>
</body>
</html>
