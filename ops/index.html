const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const VIEWS = [["start", "Übersicht"], ["auftraege", "Aufträge"], ["produkte", "Produkte"], ["social", "Social Media"], ["moebel", "Fertige Möbel"], ["beschichtung", "Beschichtung"], ["planungen", "Planungen"], ["lager", "Lager"], ["auswertung", "Auswertung"], ["finanzen", "Finanzen"], ["vorlagen", "Vorlagen"], ["katalog", "Teilekatalog"], ["regeln", "USM-Regeln"], ["protokoll", "Protokoll"]];
const D = { lager: [], typen: [], farben: [], plan: [], vorlagen: [], vpos: [], std: [], regeln: [], bew: [], build: null, ins: [], insStand: null, moebel: [], mteile: [], ausw: [], verk: [], auf: [], zahl: [] };

const UI = { hand: (() => { try { return JSON.parse(store.get(HAND_KEY, "{}")) || {}; } catch { return {}; } })(), aedit: null, aform: {}, sq: "", ssort: "aufrufe", szeit: 30, sneu: false, view: "start", f: { q: "", gruppe: "", farbe: "", zustand: "", nur: "voll" }, p: { art: "moebel", farbe: "", q: "", sort: "neu" }, kq: "", fv: null, fvFarbe: "24", fvZustand: "G", fvRows: null, del: null, pf: "", sheet: false };
const STATUS = { entwurf: "Entwurf", angebot: "Angebot", reserviert: "Reserviert", verkauft: "Verkauft", archiv: "Archiv" };
const FARBHEX = { "24": "#efeee9", "29": "#c6c8c5", "35": "#a9abae", "32": "#7f8386", "33": "#3b4146", "30": "#232425", "34": "#24344d", "27": "#1a4f8b", "28": "#2f6a46", "36": "#43472f", "25": "#d99c1c", "26": "#e2561d", "23": "#8b1f2a", "22": "#5b3b2a", "31": "#cdbb98", "CR": "#c9ced4", "SW": "#222", "GL": "#cfe6ee" };
const farbName = c => (D.farben.find(f => f.code === c) || { name: c || "" }).name;
const num = n => (Number(n) || 0).toLocaleString("de-DE");
const kurz = t => String(t || "").replace(/^USM Haller\s+/i, "");
const tageHer = t => { const d = Math.floor((Date.now() - new Date(t)) / 864e5); return d <= 0 ? "heute" : d === 1 ? "gestern" : `vor ${d} Tagen`; };
const preisText = e => e.preis != null ? eur(e.preis).replace(",00", "") + (e.vb ? " VB" : "") : "Preis auf Anfrage";
const bild = (e, i = 0, r = "$_35") => ((e.bilder || [])[i] || "").replace("$_57", r);
const proTag = e => { const v = e.aufrufeVerlauf || []; if (v.length < 2) return null; const [d0, a0] = v[0], [d1, a1] = v[v.length - 1]; const t = (new Date(d1) - new Date(d0)) / 864e5; return t > 0 ? (a1 - a0) / t : null; };
const istNeu = e => e.aktiv && (Date.now() - new Date(e.erstellt)) < 3 * 864e5;

/* ---------- Anmeldung ---------- */
let signup = false;
document.getElementById("l-mode").onclick = () => {
  signup = !signup;
  document.getElementById("l-pw2-box").hidden = !signup;
  document.getElementById("l-go").textContent = signup ? "Zugang einrichten" : "Anmelden";
  document.getElementById("l-mode").textContent = signup ? "Zugang schon eingerichtet? Anmelden" : "Erstes Mal hier? Zugang einrichten";
};
const EINL = (() => { const q = new URLSearchParams(location.search); return q.get("einladung") ? { token: q.get("einladung"), typ: q.get("typ") === "recovery" ? "recovery" : "invite", mail: q.get("mail") || "" } : null; })();
function einladungZeigen() {
  document.getElementById("login").hidden = false; document.getElementById("app").hidden = true;
  const m = document.getElementById("l-mail"); m.value = EINL.mail; m.readOnly = true;
  document.getElementById("l-pw").autocomplete = "new-password";
  document.getElementById("l-pw2-box").hidden = false;
  document.getElementById("l-go").textContent = "Passwort festlegen und starten";
  document.getElementById("l-mode").hidden = true;
  document.querySelector(".login-titel").textContent = "Ops · Social Media";
  document.querySelector(".login-card .note").textContent = "Willkommen! Leg einmal dein eigenes Passwort fest. Danach meldest du dich immer mit dieser E-Mail und deinem Passwort an.";
}
document.getElementById("lf").onsubmit = async e => {
  e.preventDefault();
  if (EINL) {
    const pw = document.getElementById("l-pw").value, msg = document.getElementById("l-msg");
    msg.innerHTML = "";
    if (pw.length < 8) { msg.innerHTML = `<p class="err">Bitte mindestens 8 Zeichen.</p>`; return; }
    if (pw !== document.getElementById("l-pw2").value) { msg.innerHTML = `<p class="err">Die Passwörter sind nicht gleich.</p>`; return; }
    await sb.auth.signOut().catch(() => {});
    const v = await sb.auth.verifyOtp({ token_hash: EINL.token, type: EINL.typ });
    if (v.error) { msg.innerHTML = `<p class="err">Der Einladungslink ist nicht mehr gültig. Bitte kurz bei Samuel oder Leon melden, dann kommt ein neuer.</p>`; return; }
    const u = await sb.auth.updateUser({ password: pw });
    if (u.error) { msg.innerHTML = `<p class="err">${esc(u.error.message)}</p>`; return; }
    history.replaceState(null, "", location.pathname);
    location.reload(); return;
  }
  const email = document.getElementById("l-mail").value.trim(), password = document.getElementById("l-pw").value, msg = document.getElementById("l-msg");
  msg.innerHTML = "";
  if (signup && password !== document.getElementById("l-pw2").value) { msg.innerHTML = `<p class="err">Die Passwörter sind nicht gleich.</p>`; return; }
  const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.innerHTML = `<p class="err">${esc(error.message === "Invalid login credentials" ? "E-Mail oder Passwort falsch." : error.message === "Email not confirmed" ? "Zugang ist noch nicht freigeschaltet. Kurz Bescheid geben, dann schalte ich ihn frei." : error.message)}</p>`; return; }
  if (!data.session) { msg.innerHTML = `<p class="okmsg">Zugang angelegt. Sobald er freigeschaltet ist, hier anmelden.</p>`; return; }
  start();
};
document.getElementById("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };



/* Auftrag ↔ Planer: jedes Möbel im Auftrag soll im Planer ansehbar sein und eine Kalkulation haben */
const insPlaner = a => a.inserat && D.ins.find(e => String(e.id) === String(a.inserat) && e.planer);
function planerLink(a) {
  if (a.planung_id) return `planer.html?id=${a.planung_id}`;
  if (insPlaner(a)) return `planer.html?inserat=${a.inserat}&auftrag=${a.id}`;
  if (a.moebel_id) return `planer.html?moebel=${a.moebel_id}`;
  // Nur Aufträge ohne Kleinanzeigen-Inserat (privat/direkt) bekommen einen leeren Planer; Einzelteil-Verkäufe aus Inseraten nicht
  return a.inserat ? "" : `planer.html?auftrag=${a.id}`;
}
const AUTO_KALK = new Set();
function autoKalkulation() {
  if (ROLLE.rolle !== "voll") return;
  const offen = D.auf.filter(a => a.status !== "storniert" && !a.verkauf_id && !a.moebel_id && !(a.teile_liste || []).length && !AUTO_KALK.has(a.id));
  const job = offen.filter(a => (!a.planung_id && insPlaner(a)) || (a.planung_id && !(a.kalkulation || []).length)).slice(0, 3);
  job.forEach((a, i) => {
    AUTO_KALK.add(a.id);
    setTimeout(() => {
      const f = document.createElement("iframe");
      f.hidden = true; f.src = (a.planung_id ? `planer.html?id=${a.planung_id}` : `planer.html?inserat=${a.inserat}`) + `&auftrag=${a.id}&still=1`;
      document.body.appendChild(f); setTimeout(() => f.remove(), 30000);
    }, 1500 + i * 4000);
  });
}

/* ---------- Social Media ---------- */
async function loadSocial() {
  const opt = (t, m) => fetchAll(t, "*", m).catch(() => []);
  const von = new Date(Date.now() - (UI.szeit || 30) * 864e5).toISOString().slice(0, 10), bis = new Date().toISOString().slice(0, 10);
  const [plan, ins, funnel] = await Promise.all([opt("social_plan", q => q.order("reihenfolge")),
    fetch("data/inserate.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : { inserate: [] }).catch(() => ({ inserate: [] })),
    sb.rpc("social_funnel", { p_von: von, p_bis: bis }).then(r => r.data || {}, () => ({}))]);
  Object.assign(SOC, { plan, ins: (ins.inserate || []), insStand: ins.stand, sellerId: ins.sellerId, funnel, funnelZeit: UI.szeit || 30 });
  const [konten, tage, beitraege, ideen] = await Promise.all([opt("social_konto", q => q.order("plattform")), opt("social_tag", q => q.gte("datum", new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10)).order("datum")),
    opt("social_beitrag", q => q.order("veroeffentlicht_am", { ascending: false })), opt("social_idee", q => q.neq("status", "archiv").order("erstellt_am", { ascending: false }))]);
  Object.assign(SOC, { konten, tage, beitraege, ideen });
  if (ROLLE.rolle === "social") D.claude = await opt("claude_auftrag", q => q.order("erstellt_am", { ascending: false }));
}
const PLATT = { website: ["Website", "#2b6cb0"], kleinanzeigen: ["Kleinanzeigen", "#86b817"], instagram: ["Instagram", "#c13584"], tiktok: ["TikTok", "#111"], youtube: ["YouTube", "#e00"], facebook: ["Facebook", "#1877f2"], pinterest: ["Pinterest", "#e60023"], linkedin: ["LinkedIn", "#0a66c2"] };
const zahl = n => n == null ? "–" : Number(n) >= 10000 ? (Number(n) / 1000).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " Tsd." : Number(n).toLocaleString("de-DE");
const IDEE_ST = [["idee", "Idee"], ["geplant", "Geplant"], ["gedreht", "Gedreht"], ["online", "Online"]];
function sparkline(werte, farbe) {
  const v = werte.filter(x => x != null); if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), w = 160, h = 36, d = max - min || 1;
  const pts = werte.map((x, i) => x == null ? null : `${(i / (werte.length - 1) * w).toFixed(1)},${(h - 3 - (x - min) / d * (h - 6)).toFixed(1)}`).filter(Boolean).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${farbe}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function kontoKarte(k) {
  const tage = SOC.tage.filter(t => t.konto_id === k.id), heute = tage[tage.length - 1] || {};
  const seit = n => tage.filter(t => new Date(t.datum) >= new Date(Date.now() - n * 864e5));
  const summe = (arr, f) => arr.reduce((a, t) => a + (Number(t[f]) || 0), 0);
  const w7 = seit(7), vor = tage.find(t => new Date(t.datum) >= new Date(Date.now() - 8 * 864e5));
  const fNeu = heute.follower != null && vor && vor.follower != null ? heute.follower - vor.follower : null;
  const auf7 = summe(w7, "aufrufe"), inter7 = summe(w7, "likes") + summe(w7, "kommentare") + summe(w7, "shares") + summe(w7, "saves");
  const [pn, pf] = PLATT[k.plattform] || [k.plattform, "#444"];
  return `<section class="card soc-konto"><div class="card-head"><h2><i class="dot" style="background:${pf}"></i> ${esc(pn)} <span class="wo">@${esc(k.handle)}</span></h2>${k.url ? `<a href="${esc(k.url)}" target="_blank" rel="noopener">öffnen</a>` : ""}</div>
    <div class="stats">${stat("Follower", zahl(heute.follower), fNeu != null ? `${fNeu >= 0 ? "+" : ""}${zahl(fNeu)} in 7 Tagen` : "")}${stat("Aufrufe 7 Tage", zahl(w7.length ? auf7 : null))}${stat("Interaktionen 7 Tage", zahl(w7.length ? inter7 : null), auf7 ? (inter7 / auf7 * 100).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " % der Aufrufe" : "")}</div>
    ${tage.length > 1 ? `<div class="soc-trend"><span class="wo">Follower, letzte ${tage.length} Tage</span>${sparkline(tage.map(t => t.follower), pf)}</div>` : ""}
    <p class="note">${k.stand ? "Stand " + when(k.stand) : "Noch keine Zahlen abgerufen."}</p></section>`;
}
/* Social: vom Follower zum Kunden, Website, Kleinanzeigen, Strategie */
function kaZahlen(tage) {
  const ab = new Date(Date.now() - tage * 864e5).toISOString().slice(0, 10), akt = (SOC.ins || []).filter(e => e.aktiv);
  let neu = 0, mitVerlauf = 0;
  akt.forEach(e => { const v = e.aufrufeVerlauf || []; if (!v.length) return; const alt = v.filter(x => x[0] < ab).slice(-1)[0]; const jetzt = v[v.length - 1]; neu += jetzt[1] - (alt ? alt[1] : 0); mitVerlauf++; });
  return { akt, aufrufe: akt.reduce((a, e) => a + (e.aufrufe || 0), 0), gemerkt: akt.reduce((a, e) => a + (e.gemerkt || 0), 0), anfragen: akt.reduce((a, e) => a + (e.anfragen || 0), 0), neu: mitVerlauf ? neu : null };
}
function vFunnel() {
  const t = UI.szeit || 30, ab = new Date(Date.now() - t * 864e5);
  const summe = (pl, f) => SOC.tage.filter(x => new Date(x.datum) >= ab && (SOC.konten.find(k => k.id === x.konto_id) || {}).plattform === pl).reduce((a, x) => a + (Number(x[f]) || 0), 0);
  const social = summe("instagram", "reichweite") + summe("tiktok", "aufrufe"), web = summe("website", "reichweite"), ka = kaZahlen(t), f = SOC.funnel || {};
  const stufen = [["Reichweite Social", social || null, "Instagram und TikTok"], ["Website-Besucher", web || null, "saleo-design.de"], ["Kleinanzeigen-Aufrufe", ka.neu ?? ka.aufrufe, ka.neu != null ? "im Zeitraum" : "gesamt, aktive Inserate"], ["Gemerkt", ka.gemerkt, "Kleinanzeigen-Merkliste"], ["Anfragen", f.anfragen ?? ka.anfragen, "Chats mit Interessenten"], ["Kunden", f.verkaeufe ?? null, "bezahlte Aufträge"]];
  const max = Math.max(1, ...stufen.map(x => Number(x[1]) || 0));
  return `<section class="card"><div class="card-head"><h2>Vom Follower zum Kunden</h2><span class="note">letzte ${t > 400 ? "Zeit" : t + " Tage"} · Zeitraum unten bei Beiträgen wählbar</span></div>
    <div class="funnel">${stufen.map(([n, v, h]) => `<div class="fz"><span class="fn">${n}<small>${h}</small></span><span class="fb"><i style="width:${v ? Math.max(3, Math.round(Number(v) / max * 100)) : 0}%"></i></span><b>${v == null ? "–" : zahl(v)}</b></div>`).join("")}</div>
    <p class="note">Ziel ist nicht die Reichweite, sondern die unterste Zeile: Kunden. Alles darüber zeigt, wo Interessenten verloren gehen.</p></section>`;
}
function webKarte(k) {
  const tage = SOC.tage.filter(t => t.konto_id === k.id), w = n => tage.filter(t => new Date(t.datum) >= new Date(Date.now() - n * 864e5));
  const s = (arr, f) => arr.reduce((a, t) => a + (Number(t[f]) || 0), 0), d = k.details || {};
  const liste = (arr, kn, kv) => (arr || []).slice(0, 6).map(x => `<div class="list-row"><div class="grow wo">${esc(String(x[kn] || "").replace(/^https?:\/\/(www\.)?saleo-design\.de/, "") || "/")}</div><b>${zahl(x[kv])}</b></div>`).join("");
  return `<section class="card soc-konto"><div class="card-head"><h2><i class="dot" style="background:#2b6cb0"></i> Website <span class="wo">${esc(k.handle)}</span></h2><a href="${esc(k.url || "https://saleo-design.de")}" target="_blank" rel="noopener">öffnen</a></div>
    <div class="stats">${stat("Besucher 7 Tage", zahl(w(7).length ? s(w(7), "reichweite") : null))}${stat("Seitenaufrufe 7 Tage", zahl(w(7).length ? s(w(7), "aufrufe") : null))}${stat("Besucher 30 Tage", zahl(w(30).length ? s(w(30), "reichweite") : null))}</div>
    ${tage.length > 1 ? `<div class="soc-trend"><span class="wo">Besucher pro Tag</span>${sparkline(tage.map(t => t.reichweite), "#2b6cb0")}</div>` : ""}
    ${(d.seiten || []).length ? `<h3 style="font-size:.9rem;margin:10px 0 4px">Meistbesuchte Seiten</h3>${liste(d.seiten, "seite", "aufrufe")}` : ""}
    ${(d.quellen || []).length ? `<h3 style="font-size:.9rem;margin:10px 0 4px">Woher die Besucher kommen</h3>${liste(d.quellen, "quelle", "besuche")}` : ""}
    <p class="note">${k.stand ? "Stand " + when(k.stand) : "Website ist mit Metricool verbunden (cookielos). Die ersten Zahlen holt die Automatik mit dem nächsten stündlichen Abgleich."}</p></section>`;
}
function kaKarte() {

function stZeitraum(z) {
  const [j, t] = z.split("-"), J = +j;
  if (!t) return [`${J}-01-01`, `${J}-12-31`];
  if (t[0] === "Q") { const q = +t[1], m1 = (q - 1) * 3 + 1, m3 = q * 3; return [`${J}-${String(m1).padStart(2, "0")}-01`, new Date(Date.UTC(J, m3, 0)).toISOString().slice(0, 10)]; }
  const m = +t; return [`${J}-${t}-01`, new Date(Date.UTC(J, m, 0)).toISOString().slice(0, 10)];
}
async function loadSteuer() {
  UI.stLaden = true;
  const [von, bis] = stZeitraum(UI.stZ);
  const { data, error } = await sb.rpc("steuer_bericht", { p_von: von, p_bis: bis });
  UI.stLaden = false; UI.stDaten = error ? null : data; UI.stFehler = error ? error.message : null; UI.stFuer = UI.stZ;
  if (UI.view === "finanzen" || UI.view === "steuer") render();
}
function stOptionen() {
  const h = new Date(), o = [];
  for (let i = 0; i < 12; i++) { const d = new Date(h.getFullYear(), h.getMonth() - i, 1); o.push([`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, d.toLocaleDateString("de-DE", { month: "long", year: "numeric" })]); }
  for (let i = 0; i < 4; i++) { const q0 = Math.floor(h.getMonth() / 3) - i, j = h.getFullYear() + Math.floor(q0 / 4), q = ((q0 % 4) + 4) % 4 + 1; o.push([`${j}-Q${q}`, `${q}. Quartal ${j}`]); }
  o.push([`${h.getFullYear()}`, `Jahr ${h.getFullYear()}`], [`${h.getFullYear() - 1}`, `Jahr ${h.getFullYear() - 1}`]);
  return o;
}
function steuerCsv() {

    "Datum;Rechnung;Kunde;Artikel;Besteuerung;Verkaufspreis brutto;Einkaufspreis § 25a;Differenz;Bemessungsgrundlage;USt;Teile ohne Lagerpreis;Fertigmöbel Altbestand"];
  d.verkaeufe.forEach(v => z.push([v.datum, q(v.nummer || ""), q(v.kaeufer_name || ""), q(v.titel || ""), v.besteuerung, n(v.vk), n(v.ek), n(v.differenz), n(v.bemessung), n(v.ust), v.ohne_beleg, v.altbestand].join(";")));
  const s = d.summe;

// Kapazität nach Blechfläche: Europalette mit 2 Aufsatzrahmen (ca. 37 cm hoch), 35er Teile stehen hochkant, größere liegen.
// Geeicht an Samuels Schätzung 12.10.: 33 Teile (ca. 7,7 m²) sind etwa 15 bis 20 % voll, also rund 44 m² pro Palette.
const PAL_KAP_M2 = 44, PAL_ORT = "Palette Beschichter";
const flaecheM2 = r => { const [a, b] = (r.mass || "350x350").split("x").map(Number); return (a || 350) * (b || 350) / 1e6; };
function vPalette() {
  const teile = (D.lager || []).filter(r => (r.lagerort || "").includes(PAL_ORT) && r.bestand > 0);
  const pb = (D.besch || []).find(b => b.status === "sammeln" && b.notiz === PAL_ORT);
  const pos = pb ? (pb.positionen || []) : [];
  const n = teile.reduce((s, r) => s + r.bestand, 0), m2 = teile.reduce((s, r) => s + r.bestand * flaecheM2(r), 0), pct = Math.min(100, Math.round(m2 / PAL_KAP_M2 * 100)), voll = pct >= 95;
  const breite = m => { const w = parseInt((m || "").split("x")[0], 10); return w > 0 ? w : 350; };
  // Stapel: gleiche Maße auf einen Stapel, jedes Blech einzeln gezeichnet, Farbe = Zielfarbe falls schon zugeordnet
  const stapel = {};
  teile.forEach(r => {
    const key = (r.mass || "?");
    const st = stapel[key] = stapel[key] || { w: breite(r.mass), mass: r.mass, bleche: [] };
    const zu = pos.filter(p => p.teil === r.code);
    let rest = r.bestand;
    zu.forEach(p => { for (let i = 0; i < p.menge && rest > 0; i++, rest--) st.bleche.push({ r, ziel: p.zielfarbe, kunde: p.zweck === "auftrag" ? p.kunde : null }); });
    for (; rest > 0; rest--) st.bleche.push({ r, ziel: null });
  });
  const S = Object.values(stapel).sort((a, b) => b.w - a.w);
  const maxN = Math.max(1, ...S.map(x => x.bleche.length)), dick = Math.max(3, Math.min(6, Math.floor(220 / maxN) - 1));
  const W = 640, H = Math.max(190, maxN * (dick + 1) + 90), palW = 520, palX = (W - palW) / 2, palY = H - 40, gap = 10;
  const sumW = S.reduce((s, x) => s + x.w, 0) + gap * Math.max(0, S.length - 1);
  const k = Math.min(0.42, (palW - 20) / Math.max(sumW, 1));
  let x = palX + (palW - (sumW * k)) / 2;
  const svgStapel = S.map(st => {
    const w = st.w * k, out = st.bleche.map((b, i) => {
      const y = palY - (i + 1) * (dick + 1), fill = b.ziel ? (FARBHEX[b.ziel] || "#ccc") : "#d9d6cf";
      const front = (b.r.code || "").startsWith("KL");
      return `<rect class="blech${b.ziel ? " zu" : ""}" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${dick}" rx="1" fill="${fill}" stroke="${front ? "rgba(0,0,0,.45)" : "rgba(0,0,0,.18)"}" stroke-width="${front ? 1 : .6}" style="animation-delay:${(i * 18)}ms"><title>${esc(katVon(b.r.code) ? katVon(b.r.code).name : b.r.bezeichnung)} ${esc((b.r.mass || "").replace("x", " × "))}${b.r.generation === "A" ? " (alte Gen.)" : ""}${b.ziel ? " → " + esc(farbName(b.ziel)) : " · Farbe offen"}${b.kunde ? " · für " + esc(b.kunde) : ""}</title></rect>`;
    }).join("");
    const lbl = `<text x="${(x + w / 2).toFixed(1)}" y="${palY - st.bleche.length * (dick + 1) - 6}" text-anchor="middle" class="pal-lbl">${esc((st.mass || "").replace("x", "×"))} · ${st.bleche.length}</text>`;
    x += w + gap * k * 2.4; return out + lbl;
  }).join("");
  const latten = [0, 1, 2].map(i => `<rect x="${palX + i * (palW - 60) / 2}" y="${palY + 6}" width="60" height="18" fill="#b48a55"/>`).join("");
  const svg = `<svg class="palette-svg" data-palopen="1" viewBox="0 0 ${W} ${H}" role="img" aria-label="Palette mit ${n} Blechen">
    <rect x="${palX}" y="${palY}" width="${palW}" height="7" rx="1" fill="#c89c63"/>${latten}<rect x="${palX}" y="${palY + 24}" width="${palW}" height="6" rx="1" fill="#c89c63"/>
${svgStapel}
    ${!n ? `<text x="${W / 2}" y="${palY - 40}" text-anchor="middle" class="pal-lbl">Palette ist leer</text>` : ""}</svg>`;
  // Zusammenfassung je Zielfarbe
  const proFarbe = {}; pos.forEach(p => { const key = p.zielfarbe || ""; proFarbe[key] = (proFarbe[key] || 0) + p.menge; });
  const offen = n - pos.reduce((s, p) => s + p.menge, 0);
  const chips = Object.entries(proFarbe).filter(([c]) => c).map(([c, m]) => `<span class="pal-chip"><i class="dot" style="background:${FARBHEX[c] || "#ccc"}"></i> ${m} × ${esc(farbName(c))}</span>`).join("") + (offen > 0 ? `<span class="pal-chip offen">${offen} × Farbe offen</span>` : "");
  return `<section class="card palette-card"><div class="card-head"><h2>Palette Beschichter</h2><span class="badge ${voll ? "ok" : "warn"}">${voll ? "voll, kann weg" : "wird gesammelt"}</span></div>
    <div class="pal-grid"><div>${svg}</div>
    <div class="pal-side"><div class="pal-fill"><div class="pal-bar"><span style="width:${pct}%"></span></div><p><b>${n} Teile</b> · ca. <b>${pct} %</b> voll <span class="note">(${m2.toLocaleString("de-DE", { maximumFractionDigits: 1 })} von ca. ${PAL_KAP_M2} m² Blechfläche)</span></p></div>
      ${voll ? `<div class="banner info"><span><b>Die Palette ist voll.</b> Jetzt festlegen, welche Teile in welche Farbe kommen und welche für einen Kundenauftrag sind. Was offen bleibt, wählst du bei der Rückkehr.</span></div>` : `<p class="note">Noch Platz für ca. ${Math.max(0, Math.round((PAL_KAP_M2 - m2) / 0.2625))} Tablare 75 × 35. Zielfarbe und Kundenauftrag kannst du schon jetzt zuordnen.</p>`}
      <div class="pal-chips">${chips}</div>
      <p class="note">Erwartet ca. ${eur(n * 16)} netto (${eur(16)} pro Blech).</p>
      ${pb && pb.gesendet_am ? `<p class="note">✓ Übersicht an ${esc(pb.gesendet_an || "Beschichter")} gesendet, ${when(pb.gesendet_am)}</p>` : ""}
      ${n ? `<div class="pal-actions"><button class="btn ${voll && !(pb && pb.gesendet_am) ? "primary" : ""}" data-palsend="1">${pb && pb.gesendet_am ? "Nochmal an den Beschichter senden" : "Palette finalisieren und an Beschichter senden"}</button>

      versand_kunde: v("h-vk").replace(",", ".") || "0", kanal: v("h-kanal") || "kleinanzeigen", kunde_name: v("h-name"), email: v("h-mail"), adresse: str || plz || ort ? { strasse: str, plz, ort, land: "DE" } : null, wer: me() || "App" };
    b.disabled = true; b.textContent = "wird angelegt…";
    const { error } = await sb.rpc("auftrag_von_hand", { p });
    if (error) { b.disabled = false; b.textContent = "Auftrag anlegen"; UI.handOffen = true; UI.flash = "Ging nicht: " + error.message + ". Deine Eingaben sind noch da."; render(); return; }
    UI.hand = {}; store.set(HAND_KEY, "{}"); UI.handOffen = false;
    UI.flash = "Auftrag angelegt." + (p.preis && p.kunde_name && (p.email || p.adresse) ? " Der Rechnungsentwurf steht im Auftrag unter „Rechnung prüfen und senden“." : " Fehlendes kannst du jederzeit über „Bearbeiten“ im Auftrag ergänzen."); liveReload();
  }
  else if (b.dataset.aedit) {

    const ad = a.adresse || {};
    UI.aedit = a.id; UI.aform = { titel: a.titel || "", preis: a.preis ?? "", versandart: a.versandart || "abholung", versand_kunde: a.versand_kunde ?? 0, kanal: a.kanal || "kleinanzeigen", inserat: a.inserat || "",
      kunde_name: a.kaeufer_name || "", email: a.kaeufer_kontakt || "", strasse: ad.strasse || "", plz: ad.plz || "", ort: ad.ort || "", land: ad.land || "DE", notiz: a.notiz || "" };
    render();

  else if (b.dataset.aspeichern) {

    const p = { titel: String(f.titel).trim(), preis: String(f.preis).replace(",", ".").trim(), versandart: f.versandart, versand_kunde: String(f.versand_kunde).replace(",", ".").trim(), kanal: f.kanal,
      inserat: String(f.inserat).trim(), kunde_name: String(f.kunde_name).trim(), email: String(f.email).trim(), adresse: adr, notiz: String(f.notiz).trim() };
    b.disabled = true; b.textContent = "speichert…";
    const { data, error } = await sb.rpc("auftrag_aendern", { p_id: b.dataset.aspeichern, p });
    if (error) { b.disabled = false; b.textContent = "Speichern"; UI.flash = "Speichern ging nicht: " + error.message + ". Deine Änderungen sind noch da."; render(); return; }
    UI.aedit = null; UI.aform = {}; UI.flash = "Auftrag gespeichert." + (data && data.rechnung ? " " + data.rechnung + "." : ""); liveReload();
  }
  else if (b.dataset.refresh) {
    b.disabled = true; b.textContent = "wird aktualisiert…";
    try {
      const { data: ss } = await sb.auth.getSession();
      const res = await fetch(SB_URL + "/functions/v1/postfach-lesen", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + ss.session.access_token, apikey: SB_KEY }, body: "{}" });
      const o = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(o.error || "Fehler " + res.status);
      const z = (o.abgleich && o.abgleich.zugeordnet) || 0;
      UI.flash = `Aktualisiert: ${o.neu || 0} neue Nachricht${o.neu === 1 ? "" : "en"}, ${(o.zahlungen || []).length} neue PayPal-Zahlung${(o.zahlungen || []).length === 1 ? "" : "en"}${z ? `, ${z} davon einem Auftrag zugeordnet` : ""}.`;
    } catch (e) { UI.flash = "Aktualisieren ging nicht: " + e.message; }
    UI.lastRefresh = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); liveReload();
  }
  else if (b.dataset.palab) {
    if (b.dataset.sicher !== "1") { b.dataset.sicher = "1"; b.textContent = "Sicher? Dann geht alles aus dem Lager"; b.classList.add("primary"); return; }
    b.disabled = true; b.textContent = "wird gebucht…";
    const { error } = await sb.rpc("palette_abgeben");

  else if (b.dataset.babgabe) { b.disabled = true; const { error } = await sb.rpc("beschichtung_abgeben", { p_id: b.dataset.babgabe }); UI.flash = error ? "Ging nicht: " + error.message : null; liveReload(); }
  else if (b.dataset.bzurueck) { b.disabled = true; const v = document.getElementById("bk-" + b.dataset.bzurueck)?.value; const farben = {}; document.querySelectorAll('select[id^="bf-"]').forEach(x => { if (x.value) farben[x.id.slice(3)] = x.value; }); const { error } = await sb.rpc("beschichtung_zurueck", { p_id: b.dataset.bzurueck, p_kosten_netto: v ? Number(v) : null, p_farben: farben }); UI.flash = error ? "Ging nicht: " + error.message : null; liveReload(); }
  else if (b.dataset.azurueck) { await sb.rpc("auftrag_zurueck", { p_id: b.dataset.azurueck }); liveReload(); }
  else if (b.dataset.pdel) {
    if (UI.del !== b.dataset.pdel) { UI.del = b.dataset.pdel; render(); setTimeout(() => { if (UI.del === b.dataset.pdel) { UI.del = null; render(); } }, 4000); return; }
    await sb.from("planung").delete().eq("id", b.dataset.pdel); UI.del = null;

document.addEventListener("click", e => {
  if (e.target.id === "sheet-bg" || e.target.closest("#sheet-zu")) { UI.sheet = false; render(); return; }
  // Tipp auf die Seite, auf der man schon ist: Menü trotzdem schließen (hashchange feuert dann nicht)
  const a = e.target.closest(".sheet .nav a"); if (a && a.getAttribute("href") === location.hash) { UI.sheet = false; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.sheet) { UI.sheet = false; render(); } });
document.addEventListener("click", async e => {
  const t = e.target.closest && e.target.closest("[data-ssort],[data-szeit],[data-sneu],[data-sspeichern],[data-sstatus],[data-pneu],[data-pedit],[data-pspeichern]"); if (!t) return;
  const wer = ROLLE.rolle === "social" ? (ROLLE.name || "Social") : (me() || "App");
  if (t.dataset.pneu) { const { data } = await sb.from("social_plan").insert({ titel: "Neuer Abschnitt", inhalt: "", reihenfolge: ((SOC.plan || []).slice(-1)[0]?.reihenfolge || 0) + 10, geaendert_von: wer }).select().single(); await loadSocial(); UI.pedit = data ? data.id : null; render(); return; }
  if (t.dataset.pedit != null && t.dataset.pedit !== undefined && t.hasAttribute("data-pedit")) { UI.pedit = t.dataset.pedit || null; render(); return; }
  if (t.dataset.pspeichern) { await sb.from("social_plan").update({ titel: (document.getElementById("pl-titel").value || "").trim() || "Abschnitt", inhalt: document.getElementById("pl-inhalt").value, geaendert_von: wer, geaendert_am: new Date().toISOString() }).eq("id", t.dataset.pspeichern); UI.pedit = null; await loadSocial(); render(); return; }
  if (t.dataset.ssort) { UI.ssort = t.dataset.ssort; render(); }
  else if (t.dataset.szeit) { UI.szeit = Number(t.dataset.szeit); render(); await loadSocial(); render(); }
  else if (t.dataset.sneu) { UI.sneu = t.dataset.sneu === "1"; render(); if (UI.sneu) document.getElementById("si-titel")?.focus(); }
  else if (t.dataset.sspeichern) ideeSpeichern();
  else if (t.dataset.sstatus) { await sb.from("social_idee").update({ status: t.dataset.sstatus, geaendert_am: new Date().toISOString() }).eq("id", t.dataset.sid); await loadSocial(); render(); }
});
/* Palette: öffnen, ziehen, antippen */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-palopen]")) { UI.pal = true; UI.palAnim = true; render(); return; }
  if (t.closest("[data-palclose]")) { UI.pal = false; UI.palSel = null; render(); return; }

  const mi = t.closest("[data-palminus]"); if (mi) { palMinus(mi); return; }
  const ei = t.closest("[data-palfarbe]"); if (ei && UI.palSel) palZuordnen(UI.palSel, ei.dataset.palfarbe);
});
document.addEventListener("change", e => { if (e.target.id === "st-z") { UI.stZ = e.target.value; render(); } });
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "st-csv") steuerCsv();
  else if (b.dataset.fintab) { UI.finTab = b.dataset.fintab; render(); }
  else if (b.dataset.stneu) { b.disabled = true; const { error } = await sb.rpc("steuer_neu_zuordnen", { p_auftrag: b.dataset.stneu }); if (error) UI.stFehler = error.message; UI.stFuer = null; render(); }
});
document.addEventListener("change", e => { if (e.target.id === "pal-auftrag") { UI.palAuftrag = e.target.value || null; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.pal) { UI.pal = false; UI.palSel = null; render(); } });
document.addEventListener("dragstart", e => { const tile = e.target.closest && e.target.closest("[data-paltile]"); if (tile) { e.dataTransfer.setData("text/plain", tile.dataset.paltile); e.dataTransfer.effectAllowed = "move"; tile.classList.add("drag"); } });
document.addEventListener("dragend", e => { const tile = e.target.closest && e.target.closest("[data-paltile]"); if (tile) tile.classList.remove("drag"); });
document.addEventListener("dragover", e => { const ei = e.target.closest && e.target.closest("[data-palfarbe]"); if (ei) { e.preventDefault(); document.querySelectorAll(".pal-eimer.over").forEach(x => x !== ei && x.classList.remove("over")); ei.classList.add("over"); } });
document.addEventListener("dragleave", e => { const ei = e.target.closest && e.target.closest("[data-palfarbe]"); if (ei && !ei.contains(e.relatedTarget)) ei.classList.remove("over"); });
document.addEventListener("drop", e => { const ei = e.target.closest && e.target.closest("[data-palfarbe]"); if (ei) { e.preventDefault(); ei.classList.remove("over"); const code = e.dataTransfer.getData("text/plain"); if (code) palZuordnen(code, ei.dataset.palfarbe); } });
async function checkVorlage(code) {
  UI.fv = code;
  const { data, error } = await sb.rpc("fehlteile", { p_vorlage: code, p_farbe: UI.fvFarbe, p_zustand: UI.fvZustand });

}
let reloadTimer = null;
function liveReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(async () => { if (ROLLE.rolle === "social") { await loadSocial(); render(); return; } await Promise.all([loadAll(), loadSocial()]); render(); loadBuildable().then(render); autoKalkulation(); }, 400); }

/* ---------- Start ---------- */
async function start() {
  if (EINL) { einladungZeigen(); return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { document.getElementById("login").hidden = false; document.getElementById("app").hidden = true; return; }
  const next = new URLSearchParams(location.search).get("next");
  if (next && /^planer\.html/.test(next)) { location.replace(next); return; }
  document.getElementById("login").hidden = true; document.getElementById("app").hidden = false;
  UI.view = location.hash.slice(1) || "start";
  document.getElementById("view").innerHTML = `<p class="empty">lade…</p>`;
  const { data: rl } = await sb.rpc("meine_rolle"); if (rl) ROLLE = rl;
  if (ROLLE.rolle === "social") {
    VIEWS.splice(0, VIEWS.length, ["social", "Social Media"]); UI.view = "social";
    if (ROLLE.name && !me()) store.set("sdo_wer", ROLLE.name);
    await loadSocial(); render();
    sb.channel("ops-social").on("postgres_changes", { event: "*", schema: "public", table: "claude_auftrag" }, liveReload).on("postgres_changes", { event: "*", schema: "public", table: "social_tag" }, liveReload).on("postgres_changes", { event: "*", schema: "public", table: "social_beitrag" }, liveReload).on("postgres_changes", { event: "*", schema: "public", table: "social_idee" }, liveReload)
      .subscribe(s => { const el = document.getElementById("live"); el.textContent = s === "SUBSCRIBED" ? "live verbunden" : "offline"; el.classList.toggle("on", s === "SUBSCRIBED"); });
    return;
  }
  try { await Promise.all([loadAll(), loadSocial()]); } catch (err) { document.getElementById("view").innerHTML = `<p class="err">Daten nicht geladen: ${esc(err.message)}</p>`; return; }
  if (!D.farben.length) { document.getElementById("view").innerHTML = `<p class="err">Dieser Zugang ist nicht freigeschaltet. Nur info@saleo-group.de hat Zugriff.</p>`; return; }
  render();
  loadBuildable().then(render);
  autoKalkulation();
  sb.channel("ops").on("postgres_changes", { event: "*", schema: "public", table: "teil" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "planung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "lagerbewegung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "moebel" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "auftrag" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "zahlung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "rechnung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "verbindung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "beschichtung" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "ka_einkauf" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "claude_auftrag" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "social_tag" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "social_beitrag" }, liveReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "social_idee" }, liveReload)
    .subscribe(s => { const el = document.getElementById("live"); el.textContent = s === "SUBSCRIBED" ? "live verbunden" : "offline"; el.classList.toggle("on", s === "SUBSCRIBED"); });
}
start();
