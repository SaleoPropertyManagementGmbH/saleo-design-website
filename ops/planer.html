<header class="planer-head"><div class="in">
  <a href="index.html" class="btn small" aria-label="Zur Übersicht">← Übersicht</a>
  <div class="grow"><input class="name" id="p-name" value="Neue Planung" aria-label="Name der Planung"><span id="p-meta" class="meta"></span></div>
  <div class="right-actions">
    <span class="live" id="live">verbinde…</span>
    <span id="whobox"></span>

    <div class="seg" role="group" aria-label="Ansicht"><button id="v-intern" aria-pressed="true">Planer</button><button id="v-kunde" aria-pressed="false">Kundenansicht</button></div>
    <button class="btn" id="savecopy" hidden title="Speichert eine neue, eigene Planung. Die bisherige bleibt unverändert.">Als neue Planung</button>

  </div>
</div></header>
<div class="wrap">
  <div id="banner"></div>
  <div id="source"></div>
  <div class="card mobile-only"><div class="kpis" id="kpis-m"></div><p class="note" style="margin-top:8px">Details unten bei Kalkulation und Stückliste.</p></div>
  <div class="layout" id="layout">
    <section class="panel" aria-label="Möbel planen">

        <div class="toolbar" id="toolbar">

const VAT = 0.19, REGEL_AUFSCHLAG = 0.10;

let uid = 1;
const F = (x, y, w, h, front = "", back = "BL", inside = "") => ({ id: uid++, x, y, w, h, front, back, inside, lock: "U", gen: "N", rahmen: false, openL: false, openR: false, col: {} });

  "Highboard": () => [F(0, 0, 750, 350, "KL"), F(750, 0, 750, 350, "AZ"), F(0, 350, 750, 350), F(750, 350, 750, 350, "", "BL", "ZT")],

};

const state = { fields: TEMPLATES["Sideboard"](), depth: 350, color: "24", zustand: "G", base: "FU", sides: "BL", top: "BL", doppel: false, extra: [],
  buyNew: {}, besch: {}, sel: 1, multi: new Set([1]), multiMode: false, price: null, rabatt: 0, ertragsteuer: 30, neupreis: "", view: "intern", tab: "bom", ordered: false, flash: null,
  paint: { part: "all", scope: "all" } };
const undoStack = [];
const sels = () => state.fields.filter(f => state.multi.has(f.id));
function selectOnly(id) { state.sel = id; state.multi = new Set([id]); }

/* ---------- Live-Daten ---------- */
const LIVE = { teil: [], tt: {}, std: [], ins: [], verb: {}, eigen: {}, ok: false, beschPreis: 16, palVersand: 225 };
const PLAN = { id: null, name: "Neue Planung", status: "entwurf", dirty: false, stamp: null, by: "", inserat: null, moebel: null, vorlage: false };
const kurzTitel = t => String(t || "").replace(/^USM Haller\s+/i, "");
async function loadLive() {
  const [teil, tt, std, verb] = await Promise.all([
    fetchAll("teil", "code,typ,mass,farbe,zustand,generation,bestand,reserviert,durchschnittspreis,lagerort,nur_neu,neupreis"),
    fetchAll("teiltyp", "code,richtwert,standardfarbe"),
    fetchAll("usm_standard", "*"),
    fetchAll("teil_verbaut", "*").catch(() => [])
  ]);
  LIVE.verb = Object.fromEntries(verb.map(v => [v.teil, v]));
  LIVE.beschPreis = 16; LIVE.palVersand = 225; try { const { data: fb } = await sb.from("firma").select("schluessel,wert").in("schluessel", ["beschichtung_preis_blech", "beschichtung_palette_versand"]); (fb || []).forEach(x => { if (x.schluessel === "beschichtung_preis_blech") LIVE.beschPreis = Number(x.wert) || 16; else LIVE.palVersand = Number(x.wert) || 225; }); } catch (_) {}
  LIVE.teil = teil; LIVE.tt = Object.fromEntries(tt.map(t => [t.code, t])); LIVE.std = std; LIVE.ok = true;
  if (!LIVE.ins.length) LIVE.ins = await fetch("data/inserate.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : { inserate: [] }).then(d => d.inserate || []).catch(() => []);
  // Von Hand korrigierte Planungen zu einem Inserat gelten künftig als Vorlage für dieses Inserat
  let korr = []; try { korr = (await sb.from("planung").select("daten,geaendert_am").not("daten->>_inserat", "is", null).order("geaendert_am", { ascending: false }).limit(500)).data || []; } catch (_) {}
  LIVE.korr = {}; korr.forEach(p => { const k = p.daten && p.daten._vorlage && p.daten._inserat; if (k && !LIVE.korr[k]) LIVE.korr[k] = p.daten; });
}
const dbTyp = e => e.typ === "HW" ? "HW-" + e.mass : e.typ === "KS" ? "HW-KS" : e.typ;
function estPrice(typ, mass) {
  const a = area(mass);
  if (typ === "HW") return HW[mass][1];
  return ({ KU: 4, CO: 1.2, RO: 3 + Number(mass) / 125, FU: 1.5, RN: 9, KS: 5,
    BL: 6 + 75 * a, BK: 10 + 80 * a, HR: 30 + 60 * a, BP: 8 + 85 * a, BPF: 10 + 90 * a, BAK: 20 + 120 * a, BV: 6 + 75 * a, BSZ: 10 + 80 * a, GL: 20 + 90 * a, GA: 20 + 90 * a,
    ZT: 10 + 80 * a, ZG: 15 + 90 * a, AT: 40 + 100 * a, ST: 20 + 90 * a, ER: 25 + 60 * a, KL: 50 + 130 * a, KLP: 60 + 150 * a, EIP: 80 + 160 * a, AZP: 60 + 150 * a, AZ: 50 + 130 * a, EI: 70 + 140 * a, GT: 60 + 140 * a })[typ] ?? 10;
}
const PAL_ORT = "Palette Beschichter";
const palBleche = () => (LIVE.teil || []).filter(r => (r.lagerort || "").includes(PAL_ORT)).reduce((a, r) => a + Math.max(0, r.bestand), 0);
function stockOf(e) {
  const t = dbTyp(e), anyMass = ["HW", "KS", "KU", "CO", "FU"].includes(e.typ), zs = state.zustand;
  if (e.besch) {
    // Beschichten (je Zeile wählbar): Ø-Preis des Teils, wie es auf den Paletten liegt (beliebige Farbe, gebraucht oder schlecht); liegt keins da, Ø-Lagerpreis des Teils; dazu Beschichtung je Blech netto
    const alle = LIVE.teil.filter(r => r.typ === t && (r.mass || "") === e.mass && (r.generation || "N") === (e.gen || "N"));
    const aufPal = alle.filter(r => (r.lagerort || "").includes(PAL_ORT) && r.bestand > 0);
    const src = aufPal.length ? aufPal : alle.filter(r => ["S", "G"].includes(r.zustand));
    const frei = r => Math.max(0, r.bestand - r.reserviert - ((LIVE.verb[r.code] || {}).verbaut || 0) + (LIVE.eigen[r.code] || 0));
    const qty = src.reduce((a, r) => a + frei(r), 0), stueck = src.reduce((a, r) => a + r.bestand, 0);
    const mitPreis = alle.filter(r => Number(r.durchschnittspreis) > 0);
    const basis = stueck > 0 ? src.reduce((a, r) => a + r.bestand * Number(r.durchschnittspreis), 0) / stueck
      : mitPreis.length ? mitPreis.reduce((a, r) => a + Number(r.durchschnittspreis), 0) / mitPreis.length
      : (LIVE.tt[t] && LIVE.tt[t].richtwert != null ? Number(LIVE.tt[t].richtwert) : estPrice(e.typ, e.mass));
    const lager = [...new Set(src.filter(r => frei(r) > 0).map(r => `${colorName(r.farbe)}${r.lagerort ? " (" + r.lagerort + ")" : ""}`))].slice(0, 4).join(", ");
    return { qty, verbaut: 0, price: Math.round((basis + LIVE.beschPreis) * 100) / 100, basis: Math.round(basis * 100) / 100, aufPal: aufPal.reduce((a, r) => a + frei(r), 0), src: aufPal.length ? "Ø Palette + Beschichtung" : "Ø Lager + Beschichtung", lager: lager ? "zum Beschichten: " + lager : "", nurNeu: null };
  }
  const rows = LIVE.teil.filter(r => r.typ === t && (anyMass || (r.mass || "") === e.mass) && r.farbe === e.farbe && r.zustand === zs && (r.generation || "N") === (e.gen || "N"));
  // Teile in aufgebauten Fertigmöbeln sind nicht frei, außer es ist genau das Möbel, das gerade geöffnet ist
  const frei = r => Math.max(0, r.bestand - r.reserviert - ((LIVE.verb[r.code] || {}).verbaut || 0) + (LIVE.eigen[r.code] || 0));
  const qty = rows.reduce((a, r) => a + frei(r), 0);
  const verbaut = rows.reduce((a, r) => a + Math.max(0, ((LIVE.verb[r.code] || {}).verbaut || 0) - (LIVE.eigen[r.code] || 0)), 0);
  const stueck = rows.reduce((a, r) => a + r.bestand, 0);
  let price, src;
  if (stueck > 0) { price = rows.reduce((a, r) => a + r.bestand * Number(r.durchschnittspreis), 0) / stueck; src = "Ø"; }
  else if (LIVE.tt[t] && LIVE.tt[t].richtwert != null) { price = Number(LIVE.tt[t].richtwert); src = "Richtwert"; }
  else { price = estPrice(e.typ, e.mass) * (zs === "N" ? 1.6 : 1); src = "Schätzung"; }
  const nurNeu = rows.find(r => r.nur_neu);
  return { qty, verbaut, price: Math.round(price * 100) / 100, src, lager: [...new Set(rows.map(r => r.lagerort).filter(Boolean))].join(", ") + (verbaut ? `${rows.some(r => r.lagerort) ? " · " : ""}${verbaut} verbaut` : ""), nurNeu: nurNeu ? Number(nurNeu.neupreis) || null : null };
}

/* ---------- Geometrie ---------- */

/* ---------- Hinweise und USM-Regeln ---------- */
function messages(geo) {
  const out = [], o = outer(), fs = state.fields, rollen = state.base !== "FU";
  const m = (cls, t) => out.push(`<div class="msg ${cls}">${t}</div>`);
  if (state.flash) m("bad", state.flash);
  if (geo.badTubes.length) m("bad", `Rohr ${[...new Set(geo.badTubes.map(p => p.len))].join(", ")} mm gibt es nicht.`);
  const bad = fs.flatMap(f => f._bad);
  if (bad.length) m("bad", `Nicht im USM-Programm: ${[...new Set(bad)].join(", ")}.`);
  if (o.h >= ANKER_AB[state.depth]) m("bad", `Wandverankerung zwingend: Außenhöhe ${o.h} mm, bei Tiefe ${state.depth} schreibt USM sie ab ${ANKER_AB[state.depth]} mm vor. Mindestens 2 Sets an den oberen äußeren Ecken, je Set 20 kg Haltekraft.`);
  else if (o.h >= ANKER_AB[state.depth] * 0.75) m("warn", `Hoch und schmal: ab ${ANKER_AB[state.depth]} mm Außenhöhe ist bei Tiefe ${state.depth} eine Wandverankerung Pflicht. USM empfiehlt sie immer.`);
  if (state.depth === 250 && fs.some(f => ["AZ", "EI"].includes(f.front) || f.inside === "AT" || f.rahmen)) m("bad", "Tiefe 250: keine Schublade, Einschubtür, Ausziehtablar oder Einlegerahmen. Klappe geht.");
  const glas = fs.some(f => f.back === "GL" || f.front === "GT" || f.inside === "ZG") || state.sides === "GL" || state.top === "GA";
  if (rollen && glas) m("bad", "USM: Möbel mit Glaselementen oder Glastüren nie auf Rollen.");
  const rollcontainer = rollen && state.depth === 500 && fs.every(f => f.x === 0 && (f.w === 395 || f.w === 500));
  if (rollcontainer) m("info", "Rollcontainer: Schubladen nur einzeln ausziehen, schwere Hängeregistratur nach unten. Schlüssel mit Nummer notieren.");
  else if (rollen && fs.some(f => f.front === "AZ" || f.front === "EI" || f.inside === "AT")) m("warn", "Rollen mit Auszügen: Gegengewicht nötig, sonst kippt das Möbel beim Ausziehen.");
  else if (rollen && fs.some(f => f.front === "KL" || f.front === "KLP")) m("info", "Rollen mit Klappen: Gegengewicht für die Kippsicherheit einplanen.");
  if (state.sides === "GL" && fs.some(f => f.inside === "ZG")) m("bad", "Glas-Zwischentablar nur mit Metall-Seiten.");
  const fl = fs.filter(f => f._float).length;
  if (fl) m("info", `${fl === 1 ? "Ein Fach steht" : fl + " Fächer stehen"} ohne Fach darunter. Statik bitte selbst einschätzen.`);
  if (fs.some(f => f.front === "AZ") && fs.some(f => f.front === "AZ" && f.y > 0)) m("info", "Auszüge möglichst unten. Oben mit Wandbefestigung oder Gegengewicht.");
  if (fs.some(f => f.front === "AZ" && !f.rahmen)) m("info", "Schublade ohne Einlegerahmen ist an drei Seiten offen.");
  if (fs.some(f => f.inside === "AT" || f.front === "AZ")) m("info", `Ausziehtablar trägt ${state.depth >= 500 ? 50 : 35} kg bei Tiefe ${state.depth}.`);
  return out.join("");
}

function fromStandard(name) {

  const n = k => { const m = first.match(new RegExp("(\\d+)\\s*" + k)); return m ? +m[1] : (new RegExp(k).test(first) ? 1 : 0); };

  fields.forEach(f => { if (az > 0 && !f.front && CAT.AZ.includes(`${f.w}x${f.h}`)) { f.front = "AZ"; az--; } else if (kl > 0 && !f.front && CAT.KL.includes(`${f.w}x${f.h}`)) { f.front = "KL"; kl--; } });

function renderSource() {
  const box = document.getElementById("source"), m = PLAN.moebel, e = PLAN.inserat && LIVE.ins.find(x => x.id === PLAN.inserat);
  if (m) {
    const st = { aufgebaut: ["ok", "aufgebaut, sofort verfügbar"], reserviert: ["warn", "reserviert"], verkauft: ["", "verkauft"], zerlegt: ["", "zerlegt"] }[m.status] || ["", m.status];
    box.innerHTML = `<div class="card source">${e && e.bilder && e.bilder[0] ? `<div class="thumbs"><img src="${esc(e.bilder[0].replace("$_57", "$_35"))}" alt=""></div>` : ""}
      <div><b>Fertigmöbel: ${esc(m.name)}</b> <span class="badge ${st[0]}">${st[1]}</span><div class="wo">${[m.masse ? m.masse + " cm" : "", m.lagerort ? "Lagerort " + m.lagerort : "", "eingekauft " + new Date(m.erstellt_am).toLocaleDateString("de-DE")].filter(Boolean).join(" · ")}</div>
      <div class="note" style="margin-top:4px">Die Teile dieses Möbels zählen im Lager mit, sind aber als verbaut markiert. Hier im Planer gelten sie als vorhanden.${!PLAN.id ? " Beim Speichern entsteht eine neue, eigene Planung, das Fertigmöbel selbst bleibt unverändert." : ""}</div></div>
      ${e ? `<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Anzeige öffnen</a>` : ""}</div>`;
    return;
  }
  if (!e) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="card source"><div class="thumbs">${(e.bilder || []).slice(0, 3).map(u => `<a href="${esc(e.url)}" target="_blank" rel="noopener"><img src="${esc(u.replace("$_57", "$_35"))}" alt=""></a>`).join("")}</div>
    <div><b>${esc(kurzTitel(e.titel))}</b><div class="wo">Inserat ${e.preis ? eur(e.preis).replace(",00", "") : "Preis auf Anfrage"}${e.masse && e.masse.b ? ` · ${e.masse.b} × ${e.masse.h} × ${e.masse.t || "?"} cm` : ""}${e.neupreis ? ` · Neupreis ${eur(e.neupreis).replace(",00", "")}` : ""}${e.aktiv ? "" : " · nicht mehr online"}</div>${e.hinweis ? `<div class="note" style="margin-top:4px">${esc(e.hinweis)}</div>` : ""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Anzeige öffnen</a>
    <label class="note" style="display:inline-flex;gap:6px;align-items:center" title="Dieser Aufbau wird beim nächsten Öffnen des Inserats und bei neuen Aufträgen dazu als Ausgangspunkt genommen"><input type="checkbox" id="p-vorlage"${PLAN.vorlage ? " checked" : ""}> Als Vorlage für dieses Inserat</label></div>
    ${!PLAN.id ? `<p class="note" style="margin:6px 0 0">Beim Speichern entsteht eine neue, eigene Planung. Das Inserat und andere Planungen bleiben unverändert. Oben den Namen eintragen, z. B. den Kunden.</p>` : ""}</div>`;
}
function showBanner(html) { document.getElementById("banner").innerHTML = html ? `<div class="banner">${html}</div>` : ""; }
function subscribe() {
  sb.channel("planer")
    .on("postgres_changes", { event: "*", schema: "public", table: "teil" }, async () => { await loadLive(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "moebel" }, async () => { await loadLive(); render(); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "planung" }, p => {
      const n = p.new; if (!PLAN.id || n.id !== PLAN.id || (n.daten && n.daten._geraet === DEVICE)) return;
      showBanner(`<span><b>${esc(n.geaendert_von || "Jemand")}</b> hat diese Planung um ${when(n.geaendert_am)} auf einem anderen Gerät gespeichert.</span><span><button class="btn" id="reload">Diese Version laden</button> <button class="btn" id="keep">Meine behalten</button></span>`);
    })
    .subscribe(s => { const el = document.getElementById("live"); el.textContent = s === "SUBSCRIBED" ? "live" : "offline"; el.classList.toggle("on", s === "SUBSCRIBED"); });
}

/* ---------- Aktionen ---------- */
function tryChange(mutate) {
  const before = JSON.stringify(state.fields);
  mutate();
  const fs = state.fields;
  if (fs.some((a, i) => fs.some((b, j) => i < j && overlaps(a, b)))) { state.fields = JSON.parse(before); state.flash = "Da ist schon ein Fach. Andere Stelle oder anderes Maß wählen."; return false; }
  if (staggered()) { state.fields = JSON.parse(before); state.flash = "Kugel auf Kugel: Oben und unten nur bündig und in gleicher Breite anbauen. Seitlich ist alles frei."; return false; }
  undoStack.push(JSON.stringify({ fields: JSON.parse(before), sel: state.sel })); if (undoStack.length > 60) undoStack.shift();
  state.ordered = false; markDirty();
  return true;
}
function addField(dir) {
  const f = state.fields.find(q => q.id === state.sel); if (!f) return;
  const n = dir === "right" ? F(f.x + f.w, f.y, f.w, f.h) : dir === "left" ? F(f.x - f.w, f.y, f.w, f.h) : dir === "bottom" ? F(f.x, f.y - f.h, f.w, f.h) : F(f.x, f.y + f.h, f.w, f.h);
  n.col = JSON.parse(JSON.stringify(f.col || {}));
  if (n.y < 0) { state.flash = "Unter dem Boden geht nichts."; return; }
  if (tryChange(() => state.fields.push(n))) selectOnly(n.id);
}
document.addEventListener("click", async e => {
  const h = e.target.closest(".handle"); if (h) { addField(h.dataset.add); render(); return; }
  const fb = e.target.closest(".fbox"); if (fb) {
    if (state.view !== "intern") return;
    const id = +fb.dataset.id;
    if (e.shiftKey || e.metaKey || e.ctrlKey || state.multiMode) {
      if (state.multi.has(id) && state.multi.size > 1) { state.multi.delete(id); if (state.sel === id) state.sel = [...state.multi][0]; }
      else { state.multi.add(id); state.sel = id; }
    } else selectOnly(id);
    render(); return;
  }
  const t = e.target.closest("button"); if (!t) return;
  const f = state.fields.find(q => q.id === state.sel);
  if (t.id === "v-intern" || t.id === "v-kunde") { state.view = t.id.slice(2); state.ordered = false; }
  else if (t.id === "save") { await save(); return; }
  else if (t.id === "savecopy") {
    PLAN.id = null; PLAN.stamp = null; PLAN.status = "entwurf"; PLAN.vorlage = false; PLAN.moebel = null; LIVE.eigen = {};
    if (!/kopie|kunde/i.test(PLAN.name)) PLAN.name = PLAN.name + " (Kunde)";
    await save();
    const n = document.getElementById("p-name"); if (n) { n.focus(); n.select(); }
    return;
  }
  else if (t.id === "reload") { await loadPlan(PLAN.id); showBanner(""); }
  else if (t.id === "keep") { showBanner(""); markDirty(); }
  else if (t.id && t.id.startsWith("t-")) state.tab = t.id.slice(2);
  else if (t.dataset.tpl) { tryChange(() => { applyTpl(t.dataset.tpl); }); selectOnly(state.fields[0].id); state.price = null; }
  else if (t.dataset.depth) { state.depth = +t.dataset.depth; markDirty(); }
  else if (t.id === "undo" && undoStack.length) { const s = JSON.parse(undoStack.pop()); state.fields = s.fields; selectOnly(state.fields.some(q => q.id === s.sel) ? s.sel : state.fields[0].id); markDirty(); }
  else if (t.dataset.front != null && f) tryChange(() => { sels().forEach(q => { q.front = t.dataset.front; }); });
  else if (t.dataset.back != null && f) tryChange(() => { sels().forEach(q => q.back = t.dataset.back); });
  else if (t.dataset.lock != null && f) tryChange(() => { sels().forEach(q => q.lock = t.dataset.lock); });
  else if (t.dataset.soft != null && f) tryChange(() => { sels().forEach(q => q.soft = t.dataset.soft === "1"); });
  else if (t.dataset.inside != null && f) tryChange(() => { sels().forEach(q => q.inside = t.dataset.inside); });
  else if (t.dataset.gen != null && f) tryChange(() => { sels().forEach(q => { q.gen = t.dataset.gen; q.lock = q.gen === "A" ? "D" : "U"; }); });
  else if (t.dataset.open && f) { const k = "open" + t.dataset.open, v = !sels().every(q => q[k]); tryChange(() => { sels().forEach(q => q[k] = v); }); }
  else if (t.dataset.perf != null && f) tryChange(() => { sels().forEach(q => q.perf = t.dataset.perf === "1"); });
  else if (t.dataset.flag && f) { const k = t.dataset.flag, v = !sels().every(q => q[k]); tryChange(() => { sels().forEach(q => q[k] = v); }); }
  else if (t.dataset.rahmen != null && f) tryChange(() => { sels().forEach(q => q.rahmen = t.dataset.rahmen === "1"); });
  else if (t.dataset.part) state.paint.part = t.dataset.part;
  else if (t.dataset.scope) state.paint.scope = t.dataset.scope;
  else if (t.dataset.paint != null && !f) { state.paint.part = "all"; state.paint.scope = "all"; applyColor(t.dataset.paint || null); }
  else if (t.dataset.paint != null && f) applyColor(t.dataset.paint || null);
  else if (t.id === "resetcol") tryChange(() => state.fields.forEach(q => q.col = {}));
  else if (t.id === "multimode") state.multiMode = !state.multiMode;
  else if (t.id === "selsame" && f) state.multi = new Set(state.fields.filter(q => q.front === f.front && q.w === f.w && q.h === f.h).map(q => q.id));
  else if (t.id === "del" && f && state.fields.length > state.multi.size) { tryChange(() => { state.fields = state.fields.filter(q => !state.multi.has(q.id)); }); selectOnly(state.fields[0].id); }
  else if (t.dataset.rabatt != null) { state.rabatt = +t.dataset.rabatt; markDirty(); }
  else if (t.id === "order") { state.ordered = true; PLAN.status = "angebot"; await save(); return; }
  else return;
  render();
});
document.addEventListener("change", e => {
  const t = e.target, f = state.fields.find(q => q.id === state.sel);
  if (t.id === "who") { render(); return; }
  if (t.id === "p-vorlage") { PLAN.vorlage = t.checked; markDirty(); }
  else if (t.id === "p-status") { PLAN.status = t.value; markDirty(); }
  else if (t.id === "tplsel" && t.value) {
    const [k, v] = [t.value.slice(0, 1), t.value.slice(2)];
    if (PLAN.moebel) { PLAN.moebel = null; LIVE.eigen = {}; }
    if (k === "i") fromInserat(v); else if (k === "s") fromStandard(v); else { tryChange(() => { applyTpl(v); }); selectOnly(state.fields[0].id); state.price = null; PLAN.inserat = null; }
    t.value = "";
  }
  else if (t.id === "e-w" && f && t.value) tryChange(() => { sels().forEach(q => q.w = +t.value); });
  else if (t.id === "e-h" && f && t.value) tryChange(() => { sels().forEach(q => q.h = +t.value); });
  else if (t.id === "g-color") { state.color = t.value; markDirty(); }
  else if (t.id === "g-zustand") { state.zustand = t.value; state.buyNew = {}; state.besch = {}; markDirty(); }
  else if (t.dataset.besch) { state.besch = state.besch || {}; if (t.checked) state.besch[t.dataset.besch] = true; else delete state.besch[t.dataset.besch]; markDirty(); }
  else if (t.id === "g-base") { state.base = t.value; markDirty(); }
  else if (t.id === "g-sides") { state.sides = t.value; markDirty(); }
  else if (t.id === "g-doppel") { state.doppel = t.value === "1"; markDirty(); }
  else if (t.id === "g-top") { state.top = t.value; markDirty(); }
  else if (t.dataset.buynew) { if (t.checked) { const r = bom(geometry()).find(x => x.code === t.dataset.buynew); state.buyNew[t.dataset.buynew] = Math.round((r ? r.price * 2.2 : 0) * 100) / 100; } else delete state.buyNew[t.dataset.buynew]; markDirty(); }
  else if (t.dataset.nkprice) { state.buyNew[t.dataset.nkprice] = Math.max(0, +t.value || 0); markDirty(); }
  else if (t.id === "in-price") { state.price = Math.max(0, +t.value || 0); markDirty(); }
  else if (t.id === "in-neu") { state.neupreis = t.value; markDirty(); }
  else if (t.id === "in-rabatt") { state.rabatt = Math.max(0, Math.min(50, +t.value || 0)); markDirty(); }
  else if (t.id === "in-paid") { const list = Number(state.price) || 0; state.rabatt = list ? Math.round((1 - (+t.value || 0) / list) * 1000) / 10 : 0; markDirty(); }
  else if (t.id === "in-st") state.ertragsteuer = Math.max(0, +t.value || 0);
  else if (t.id === "in-target" && t.value) {
    const ek = bom(geometry()).reduce((a, r) => a + r.cost, 0), m = +t.value / 100, k = 1 - state.rabatt / 100;
    let p = Math.ceil(ek / (1 - m) / 10) * 10;
    for (let i = 0; i < 400 && calcNumbers(ek, p * k).gewD / (p * k) < m; i++) p += 10;
    state.price = p; markDirty();
  } else return;
  render();
});
document.addEventListener("input", e => { if (e.target.id === "p-name") { PLAN.name = e.target.value; markDirty(); renderHead(); } });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); return; }
  const el = e.target.closest && e.target.closest(".fbox, .handle");
  if (!el || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  if (el.classList.contains("handle")) addField(el.dataset.add); else selectOnly(+el.dataset.id);
  render();
});
window.addEventListener("beforeunload", e => { if (PLAN.dirty) { e.preventDefault(); e.returnValue = ""; } });


/* Auftrag verknüpfen: Planung anlegen, Auftrag verlinken, Kalkulation (nur wenn leer) zu Lagerpreisen eintragen. Bucht nichts aus. */
async function auftragVerknuepfen(aid, still) {
  const sel = "id,titel,preis,planung_id,kalkulation,teile";
  const { data } = aid ? await sb.from("auftrag").select(sel).eq("id", aid).limit(1) : PLAN.id ? await sb.from("auftrag").select(sel).eq("planung_id", PLAN.id).limit(1) : { data: null };
  const a = data && data[0]; if (!a) return;
  if (!PLAN.id) {
    if (a.preis != null) state.price = Number(a.preis);
    normalize();
    const row = { name: PLAN.name || a.titel, daten: snapshot(), status: "reserviert", geaendert_am: new Date().toISOString(), geaendert_von: me() || "Automatik" };
    const { data: p, error } = await sb.from("planung").insert(row).select().single();
    if (error) return;
    PLAN.id = p.id; PLAN.status = p.status; PLAN.stamp = p.geaendert_am; PLAN.by = p.geaendert_von; PLAN.dirty = false;
    if (!still) history.replaceState(null, "", "planer.html?id=" + p.id);
  }
  const leer = !(a.kalkulation || []).length && !(a.teile || []).length;
  await sb.rpc("auftrag_planung_setzen", { p_auftrag: a.id, p_planung: PLAN.id, p_kalkulation: leer ? kalkulationAusPlan() : null, p_ueberschreiben: false });
}
function kalkulationAusPlan() {
  normalize();
  const FB = r => r.farbe && FARBIG.includes(r.typ) ? ", " + colorName(r.farbe) : "";
  return bom(geometry()).filter(r => r.qty > 0).map(r => ({ text: partName(r) + FB(r) + (r.besch ? " (beschichtet)" : ""), teil: r.code, menge: r.qty, preis: Math.round(r.cost / r.qty * 100) / 100 }));
}
// Nach dem Speichern: Kalkulation im verknüpften Auftrag (nur Aufträge ohne Lagerteile) an die Planung anpassen
async function kalkulationNachziehen() {
  if (!PLAN.id) return false;
  const { data } = await sb.from("auftrag").select("id").eq("planung_id", PLAN.id).limit(1);
  if (!data || !data[0]) return false;
  const { data: r } = await sb.rpc("auftrag_planung_setzen", { p_auftrag: data[0].id, p_planung: PLAN.id, p_kalkulation: kalkulationAusPlan(), p_ueberschreiben: true });
  return !!(r && r.kalkulation);
}
function gespeichertAnimation(zusatz) {
  let el = document.getElementById("saved-toast");
  if (!el) { el = document.createElement("div"); el.id = "saved-toast"; el.setAttribute("role", "status"); el.setAttribute("aria-live", "polite"); document.body.appendChild(el); }
  el.innerHTML = `<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l7 7 15-16"/></svg><div><b>Gespeichert</b>${zusatz ? `<span>${zusatz}</span>` : ""}</div>`;
  el.classList.remove("an"); void el.offsetWidth; el.classList.add("an");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("an"), 2600);
}

(async () => {
  if (!(await requireSession())) return;
  try { await loadLive(); } catch (err) { state.flash = "Lagerdaten nicht geladen: " + err.message; }
  const qs = new URLSearchParams(location.search);
  if (qs.get("id")) await loadPlan(qs.get("id"));
  else if (qs.get("std")) { fromStandard(qs.get("std")); PLAN.dirty = false; }
  else if (qs.get("inserat")) { fromInserat(qs.get("inserat")); PLAN.dirty = false; }
  else if (qs.get("moebel")) { await fromMoebel(qs.get("moebel")); PLAN.dirty = false; }
  if (qs.get("auftrag") || (PLAN.id && !qs.get("still"))) { try { await auftragVerknuepfen(qs.get("auftrag"), !!qs.get("still")); } catch (_) {} }
  if (qs.get("still")) return;
  render();
  subscribe();
})();
</script>
